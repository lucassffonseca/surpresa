<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nosso Céu - 3 Meses 🧡</title>
    
    <meta name="theme-color" content="#020204">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@800&family=Dancing+Script:wght@700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { overflow: hidden; height: 100vh; width: 100vw; background-color: #020204; color: #fff; font-family: sans-serif; }
        
        /* O Canvas do Three.js onde o céu será desenhado */
        #webgl-canvas { position: absolute; inset: 0; z-index: 1; }

        /* Interface por cima do 3D */
        .ui-container {
            position: fixed; inset: 0; z-index: 10;
            display: flex; flex-direction: column; justify-content: space-between;
            padding: 40px 20px; pointer-events: none; text-align: center;
        }
        .main-title { font-family: 'Dancing Script', cursive; font-size: 36px; color: #FF6A00; text-shadow: 0 0 15px rgba(255,106,0,0.6); pointer-events: auto; }
        .sub-title { font-family: 'Montserrat', sans-serif; font-size: 11px; text-transform: uppercase; letter-spacing: 3px; color: #aaa; margin-top: 5px; opacity: 0.7; }
        
        .instruction-box {
            background: rgba(0,0,0,0.5); backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 15px;
            padding: 15px; margin-bottom: 20px; pointer-events: auto;
        }
        .ins-text { font-size: 14px; color: #eee; font-weight: 300; line-height: 1.4; }

        /* PAINEL DE LEITURA DAS MEMÓRIAS (GLASS) */
        #memory-overlay {
            position: fixed; inset: 0; z-index: 100;
            background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            display: flex; justify-content: center; align-items: center;
            opacity: 0; visibility: hidden; transition: all 0.6s ease;
        }
        #memory-overlay.active { opacity: 1; visibility: visible; }
        .memory-card {
            background: linear-gradient(to bottom, rgba(255,255,255,0.03), rgba(0,0,0,0.9));
            border: 1px solid rgba(255, 106, 0, 0.2); border-radius: 24px;
            width: 85%; max-width: 340px; padding: 35px 25px;
            text-align: center; transform: scale(0.9); transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        #memory-overlay.active .memory-card { transform: scale(1); }
        .close-btn { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 8px 20px; border-radius: 50px; text-transform: uppercase; font-size: 10px; cursor: pointer; margin-top: 20px; }
    </style>
</head>
<body>

    <canvas id="webgl-canvas"></canvas>

    <div class="ui-container">
        <div>
            <h1 class="main-title">Três Meses de Nós</h1>
            <div class="sub-title">Nossa Constelação</div>
        </div>
        
        <div class="instruction-box">
            <p class="ins-text">Estamos longe, mas olhamos para o mesmo céu.<br>Arraste o dedo para explorar nosso universo e toque nas estrelas pulsantes ✨</p>
        </div>
    </div>

    <div id="memory-overlay">
        <div class="memory-card">
            <p style="font-size: 16px; font-style: italic; color: #f0f0f0; line-height: 1.6;">"A distância e a rotina tentam nos desafiar, mas a cada reencontro, tenho a certeza de que nascemos para dar certo."</p>
            <button class="close-btn" onclick="closeMemory()">Voltar ao Céu</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <script>
        // ==========================================
        // CONFIGURAÇÃO BÁSICA THREE.JS
        // ==========================================
        let scene, camera, renderer, stars, nebula;
        const canvas = document.getElementById('webgl-canvas');

        function init() {
            // SCENE
            scene = new THREE.Scene();
            
            // CAMERA
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 0); // Camera no centro do universo

            // RENDERER
            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);

            createUniverse();
            addMemoryStars();
            
            // CONTROLES DE ARRASTAR COM O DEDO (SIMULADO)
            document.addEventListener('touchmove', onTouchMove, false);
            document.addEventListener('mousemove', onMouseMove, false);
            
            animate();
        }

        // ==========================================
        // CRIAÇÃO DO UNIVERSO (PARTÍCULAS)
        // ==========================================
        function createUniverse() {
            // 1. ESTRELAS DE FUNDO (Muitas e pequenas)
            const starGeometry = new THREE.BufferGeometry();
            const starMaterial = new THREE.PointsMaterial({ color: 0xFFFFFF, size: 0.7, transparent: true });
            const starVertices = [];
            for(let i = 0; i < 15000; i++) {
                const x = (Math.random() - 0.5) * 1000;
                const y = (Math.random() - 0.5) * 1000;
                const z = (Math.random() - 0.5) * 1000;
                starVertices.push(x, y, z);
            }
            starGeometry.setAttribute('position', new THREE.Float32BufferAttribute(starVertices, 3));
            stars = new THREE.Points(starGeometry, starMaterial);
            scene.add(stars);

            // 2. NEBULOSA (Poeira estelar laranja)
            const nebulaGeometry = new THREE.BufferGeometry();
            // Precisaríamos de uma textura realista aqui para ficar perfeito
            const nebulaMaterial = new THREE.PointsMaterial({ color: 0xFF6A00, size: 2.5, transparent: true, opacity: 0.15, blending: THREE.AdditiveBlending });
            const nebulaVertices = [];
            for(let i = 0; i < 500; i++) {
                const x = (Math.random() - 0.5) * 300;
                const y = (Math.random() - 0.5) * 300;
                const z = (Math.random() - 0.5) * 300;
                nebulaVertices.push(x, y, z);
            }
            nebulaGeometry.setAttribute('position', new THREE.Float32BufferAttribute(nebulaVertices, 3));
            nebula = new THREE.Points(nebulaGeometry, nebulaMaterial);
            scene.add(nebula);
        }

        // ==========================================
        // ESTRELAS DE MEMÓRIA (INTERATIVAS)
        // ==========================================
        let memoryStarsGroup;
        function addMemoryStars() {
            memoryStarsGroup = new THREE.Group();
            
            // Cria 3 estrelas maiores e pulsantes para os 3 meses
            const coords = [
                {x: 30, y: 50, z: -100}, // Mês 1
                {x: -50, y: -20, z: -80}, // Mês 2
                {x: 80, y: -40, z: -120}  // Mês 3
            ];

            coords.forEach(coord => {
                const geometry = new THREE.SphereGeometry(2, 16, 16);
                const material = new THREE.MeshBasicMaterial({ color: 0xFFD700, transparent: true, opacity: 0.8 });
                const star = new THREE.Mesh(geometry, material);
                star.position.set(coord.x, coord.y, coord.z);
                star.userData = { pulsate: true, originalOpacity: 0.8, openMemory: true };
                memoryStarsGroup.add(star);
            });
            
            scene.add(memoryStarsGroup);
        }

        // ==========================================
        // LÓGICA DE INTERAÇÃO E ANIMAÇÃO
        // ==========================================
        let lon = 0, lat = 0, phi = 0, theta = 0;
        let onPointerDownPointerX = 0, onPointerDownPointerY = 0, onPointerDownLon = 0, onPointerDownLat = 0;

        function onTouchMove(event) {
            if (event.touches.length === 1) {
                event.preventDefault();
                lon = (onPointerDownPointerX - event.touches[0].clientX) * 0.1 + onPointerDownLon;
                lat = (event.touches[0].clientY - onPointerDownPointerY) * 0.1 + onPointerDownLat;
            }
        }
        function onMouseMove(event) {
            // Lógica simplificada de arrastar com mouse pra PC
            lon += event.movementX * 0.05;
            lat -= event.movementY * 0.05;
        }

        function animate() {
            requestAnimationFrame(animate);

            // Atualiza a rotação da câmera com base no arrastar
            lat = Math.max(-85, Math.min(85, lat));
            phi = THREE.MathUtils.degToRad(90 - lat);
            theta = THREE.MathUtils.degToRad(lon);

            camera.target = new THREE.Vector3();
            camera.target.x = 500 * Math.sin(phi) * Math.cos(theta);
            camera.target.y = 500 * Math.cos(phi);
            camera.target.z = 500 * Math.sin(phi) * Math.sin(theta);
            camera.lookAt(camera.target);

            // Animação de pulsar das estrelas de memória
            const time = Date.now() * 0.005;
            memoryStarsGroup.children.forEach(star => {
                if (star.userData.pulsate) {
                    star.material.opacity = star.userData.originalOpacity + Math.sin(time) * 0.2;
                    star.scale.set(1 + Math.sin(time)*0.1, 1+ Math.sin(time)*0.1, 1+ Math.sin(time)*0.1);
                }
            });

            renderer.render(scene, camera);
        }

        // Simulação de clique na estrela (Lógica complexa paraThree.js/Raycaster, simplificada aqui)
        canvas.addEventListener('click', () => {
             // Em um projeto real, usaríamos THREE.Raycaster pra saber onde clicou no 3D
             openMemory();
        });

        function openMemory() {
            document.getElementById('memory-overlay').classList.add('active');
        }
        function closeMemory() {
            document.getElementById('memory-overlay').classList.remove('active');
        }

        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        init();
    </script>
</body>
</html>
