<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nosso Universo - 3 Meses</title>
    
    <meta name="theme-color" content="#050505">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&family=Inter:wght@300;400;600&family=Dancing+Script:wght@700&display=swap');

        :root {
            --dark-bg: #030305; 
            --orange-main: #FF6A00;
            --orange-light: #FF9900;
            --blue-glow: #00e5ff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body, html {
            background-color: var(--dark-bg);
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            overflow: hidden; 
            height: 100vh;
            width: 100vw;
            perspective: 1000px; /* Cria a profundidade 3D na tela */
        }

        /* --- FUNDO AMBIENTE ESPACIAL --- */
        .ambient-background { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
        .ambient-light { position: absolute; border-radius: 50%; filter: blur(90px); animation: liquidFloat 25s infinite alternate ease-in-out; opacity: 0.3; }
        .light-1 { width: 70vw; height: 70vw; background-color: rgba(255, 106, 0, 0.2); top: -20%; left: -10%; }
        .light-2 { width: 60vw; height: 60vw; background-color: rgba(0, 229, 255, 0.1); bottom: -10%; right: -10%; animation-delay: -5s; }

        @keyframes liquidFloat {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(10vw, 15vh) scale(1.2); }
        }

        /* ESTRELAS DE FUNDO */
        .stars { position: fixed; inset: 0; z-index: 1; pointer-events: none; background: transparent; }

        /* TÍTULO DA TELA */
        .title-container {
            position: fixed; top: 40px; width: 100%; text-align: center; z-index: 10; pointer-events: none;
        }
        .main-title { font-family: 'Dancing Script', cursive; font-size: 42px; color: var(--orange-main); text-shadow: 0 0 20px rgba(255,106,0,0.5); }
        .sub-title { font-size: 12px; text-transform: uppercase; letter-spacing: 4px; color: #aaa; margin-top: 5px; }

        /* ==========================================
           O ORBE 3D
           ========================================== */
        .scene {
            position: absolute; top: 50%; left: 50%;
            width: 300px; height: 300px;
            transform: translate(-50%, -50%);
            z-index: 5;
        }

        .orb-container {
            width: 100%; height: 100%;
            position: relative;
            transform-style: preserve-3d; /* Permite elementos em 3D */
            animation: rotateOrb 30s linear infinite;
        }

        /* Pausa a rotação quando uma memória é aberta */
        .orb-container.paused { animation-play-state: paused; }

        @keyframes rotateOrb {
            0% { transform: rotateY(0deg) rotateX(15deg) rotateZ(10deg); }
            100% { transform: rotateY(360deg) rotateX(15deg) rotateZ(10deg); }
        }

        /* AS MEMÓRIAS (PONTOS DE LUZ) */
        .memory-node {
            position: absolute; top: 50%; left: 50%;
            width: 20px; height: 20px;
            margin-top: -10px; margin-left: -10px;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 0 20px var(--orange-main), 0 0 40px var(--orange-light);
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            transform-style: preserve-3d;
        }

        /* Para que o brilho e o texto do ponto fiquem sempre de frente para a câmera */
        .node-content {
            position: absolute; inset: 0; border-radius: 50%;
            animation: faceCamera 30s linear infinite reverse; /* Roda ao contrário do Orbe */
            display: flex; justify-content: center; align-items: center;
        }
        .node-label {
            position: absolute; top: -25px; white-space: nowrap; font-size: 10px;
            text-transform: uppercase; letter-spacing: 1px; color: #fff;
            background: rgba(0,0,0,0.5); padding: 2px 8px; border-radius: 10px;
            opacity: 0.6; transition: opacity 0.3s;
        }
        .memory-node:hover { transform: scale(1.5); box-shadow: 0 0 30px var(--blue-glow), 0 0 60px var(--blue-glow); }
        .memory-node:hover .node-label { opacity: 1; }

        @keyframes faceCamera {
            0% { transform: rotateY(0deg) rotateX(-15deg); }
            100% { transform: rotateY(-360deg) rotateX(-15deg); }
        }

        /* LINHAS CONECTANDO AS ESTRELAS (Efeito constelação) */
        .orb-ring {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            border: 1px dashed rgba(255, 255, 255, 0.1); border-radius: 50%;
            transform: rotateX(90deg);
        }
        .orb-ring:nth-child(2) { transform: rotateY(90deg); }


        /* ==========================================
           PAINEL DE LEITURA (VIDRO)
           ========================================== */
        #memory-overlay {
            position: fixed; inset: 0; z-index: 100;
            background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            display: flex; justify-content: center; align-items: center;
            opacity: 0; visibility: hidden; transition: all 0.5s ease;
        }
        #memory-overlay.active { opacity: 1; visibility: visible; }

        .memory-card {
            background: linear-gradient(to bottom, rgba(255,255,255,0.05), rgba(0,0,0,0.8));
            border: 1px solid rgba(255, 106, 0, 0.3); border-radius: 24px;
            width: 85%; max-width: 340px; padding: 40px 25px;
            text-align: center; transform: translateY(50px); transition: all 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
            box-shadow: 0 30px 60px rgba(0,0,0,0.9), 0 0 40px rgba(255, 106, 0, 0.1);
        }
        #memory-overlay.active .memory-card { transform: translateY(0); }

        .mem-icon { font-size: 40px; margin-bottom: 15px; }
        .mem-title { font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 20px; color: var(--orange-main); margin-bottom: 15px; text-transform: uppercase; letter-spacing: 1px; }
        .mem-text { font-size: 15px; line-height: 1.6; color: #f0f0f0; font-weight: 300; margin-bottom: 30px; font-style: italic; }

        .close-btn {
            background: rgba(255, 106, 0, 0.2); border: 1px solid var(--orange-main); color: #fff;
            padding: 10px 30px; border-radius: 50px; font-family: 'Inter', sans-serif; font-size: 12px;
            text-transform: uppercase; letter-spacing: 2px; cursor: pointer; transition: all 0.3s;
        }
        .close-btn:hover { background: var(--orange-main); box-shadow: 0 0 20px var(--orange-main); }

    </style>
</head>
<body>

    <div class="ambient-background">
        <div class="ambient-light light-1"></div>
        <div class="ambient-light light-2"></div>
        <canvas class="stars" id="stars-canvas"></canvas>
    </div>

    <div class="title-container">
        <h1 class="main-title">Nosso Universo</h1>
        <div class="sub-title">Toque em uma estrela</div>
    </div>

    <div class="scene">
        <div class="orb-container" id="orb">
            <div class="orb-ring"></div>
            <div class="orb-ring"></div>
            
            </div>
    </div>

    <div id="memory-overlay">
        <div class="memory-card">
            <div class="mem-icon" id="mem-icon">✨</div>
            <h2 class="mem-title" id="mem-title">Título</h2>
            <p class="mem-text" id="mem-text">Texto da memória vai aqui...</p>
            <button class="close-btn" onclick="closeMemory()">Voltar ao Universo</button>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. DADOS DAS MEMÓRIAS (Aqui você cria a história)
        // ==========================================
        const memorias = [
            {
                id: 1,
                icon: "☕",
                title: "Nossos Cafés",
                text: "A distância some quando compartilhamos a mesma paixão. Cada xícara que preparamos, mesmo de longe, é como se estivéssemos sentados à mesma mesa.",
                x: 0, y: 120, z: 80 
            },
            {
                id: 2,
                icon: "✈️",
                title: "A Distância",
                text: "Quilômetros são apenas números para quem sabe o que quer. A cada reencontro, o aeroporto vira o nosso lugar favorito no mundo.",
                x: 100, y: -50, z: -100
            },
            {
                id: 3,
                icon: "💌",
                title: "Cartinhas",
                text: "O que a saudade tenta esconder, as nossas palavras revelam. Ter guardado aquele pedacinho de papel mudou toda a minha história.",
                x: -120, y: 0, z: 90
            },
            {
                id: 4,
                icon: "🧡",
                title: "Você",
                text: "Em meio à rotina e aos servidores, você foi a atualização mais bonita que o meu coração já recebeu. Obrigado por ser minha paz.",
                x: 60, y: 80, z: -120
            },
            {
                id: 5,
                icon: "🔒",
                title: "Trimestre",
                text: "Três meses é só o primeiro capítulo do livro que estamos escrevendo juntos. O nosso universo está apenas começando a se expandir.",
                x: -80, y: -100, z: 50
            }
        ];

        // ==========================================
        // 2. CONSTRUÇÃO DO ORBE 3D
        // ==========================================
        const orb = document.getElementById('orb');

        memorias.forEach(mem => {
            // Cria o ponto de luz
            const node = document.createElement('div');
            node.className = 'memory-node';
            // Posiciona no espaço 3D usando X, Y, Z
            node.style.transform = `translateX(${mem.x}px) translateY(${mem.y}px) translateZ(${mem.z}px)`;
            
            // Adiciona o conteúdo que fica sempre virado para a frente
            node.innerHTML = `
                <div class="node-content">
                    <div class="node-label">${mem.title}</div>
                </div>
            `;

            // Ação de clique
            node.addEventListener('click', () => openMemory(mem));
            
            orb.appendChild(node);
        });

        // ==========================================
        // 3. LÓGICA DE ABRIR/FECHAR MEMÓRIAS
        // ==========================================
        function openMemory(memoria) {
            // Pausa a rotação do orbe
            orb.classList.add('paused');
            
            // Preenche o cartão
            document.getElementById('mem-icon').innerText = memoria.icon;
            document.getElementById('mem-title').innerText = memoria.title;
            document.getElementById('mem-text').innerText = memoria.text;
            
            // Mostra a tela
            document.getElementById('memory-overlay').classList.add('active');
        }

        function closeMemory() {
            // Esconde a tela
            document.getElementById('memory-overlay').classList.remove('active');
            
            // Volta a girar o universo (com um pequeno delay pra ficar suave)
            setTimeout(() => {
                orb.classList.remove('paused');
            }, 300);
        }

        // ==========================================
        // 4. ESTRELAS ESTÁTICAS DE FUNDO (CANVAS)
        // ==========================================
        const canvas = document.getElementById('stars-canvas');
        const ctx = canvas.getContext('2d');

        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; drawStars(); }
        window.addEventListener('resize', resize);

        function drawStars() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for(let i = 0; i < 200; i++) {
                let x = Math.random() * canvas.width;
                let y = Math.random() * canvas.height;
                let radius = Math.random() * 1.5;
                let alpha = Math.random() * 0.8 + 0.2;
                
                ctx.beginPath();
                ctx.arc(x, y, radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                ctx.fill();
            }
        }
        resize();

    </script>
</body>
</html>
