<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nosso Álbum">
<meta name="theme-color" content="#2a1748">
<meta name="robots" content="noindex, nofollow">
<title>Nossos momentos ❤️</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --acai:#2a1748; --mare:#0f4c75; --dende:#f4a02d;
    --papel:#f7f4fc; --tinta:#241636; --muda:#6d6482;
    --display:'Bricolage Grotesque','Avenir Next','Helvetica Neue',sans-serif;
    --texto:'Figtree','Avenir Next','Helvetica Neue',sans-serif;
    --topo:calc(env(safe-area-inset-top) + 20px);
    --base:calc(env(safe-area-inset-bottom) + 24px);
  }
  *{box-sizing:border-box;margin:0}
  html{-webkit-text-size-adjust:100%}
  body{font-family:var(--texto);color:#fff;font-size:17px;line-height:1.55;background:var(--acai);min-height:100dvh}
  #bg{position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,#2a1748,#1d2a5f)}
  button,input{font:inherit}
  button{cursor:pointer;border:0;-webkit-tap-highlight-color:transparent}
  :focus-visible{outline:3px solid #fff;outline-offset:3px}
  h1,h2,h3{font-family:var(--display);font-weight:800;letter-spacing:-.02em;line-height:1.04}

  .view{display:none;max-width:430px;margin:0 auto}
  body[data-state=lock] #lock, body[data-state=gate] #gate, body[data-state=som] #som{display:flex;flex-direction:column;min-height:100dvh;padding:var(--topo) 22px var(--base)}
  body[data-state=main] #main{display:block}
  body[data-state=ticket] #ticket{display:flex;flex-direction:column;min-height:100dvh;padding:var(--topo) 20px var(--base)}
  body[data-state=flight] #flight{display:flex;flex-direction:column;align-items:center;min-height:100dvh;padding:var(--topo) 20px var(--base)}
  body[data-state=arrival] #arrival{display:block}

  .cta{width:100%;height:58px;border-radius:999px;background:var(--dende);color:var(--tinta);font-weight:600;font-size:17px;box-shadow:0 10px 30px rgba(244,160,45,.35);transition:transform .15s}
  .cta:active{transform:scale(.97)}
  .cta:disabled{opacity:.45;cursor:not-allowed;transform:none}
  .link{background:none;color:#fff;text-decoration:underline;text-underline-offset:4px;font-size:15px;padding:12px 0;opacity:.85}
  .brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px}
  .brand svg{width:22px;height:22px;fill:var(--dende)}

  /* ---------- contagem ---------- */
  .cd{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .cd div{background:rgba(255,255,255,.1);border-radius:16px;padding:12px 4px;text-align:center}
  .cd b{display:block;font-family:var(--display);font-weight:800;font-size:30px;line-height:1.1}
  .cd span{font-size:13px;opacity:.8}

  /* ---------- trava, portão e som ---------- */
  .centro{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px}
  .centro h1{font-size:42px}
  .centro p{opacity:.85;max-width:22em}
  .cadeado{font-size:44px;line-height:1}
  #codigo{width:100%;height:58px;border-radius:999px;border:1.5px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);color:#fff;font-size:20px;text-align:center;padding:0 16px}
  #codigo::placeholder{color:rgba(255,255,255,.45)}
  #erro{color:#ffb4a8;font-size:15px;min-height:1.5em}

  /* ---------- álbum ---------- */
  .sec{padding:56px 22px}
  .capa{min-height:100dvh;display:flex;flex-direction:column;justify-content:flex-end;padding-top:var(--topo);padding-bottom:calc(var(--base) + 8px)}
  .capa h1{font-size:60px;margin-bottom:14px;background:linear-gradient(180deg,#fff 35%,#ffd7a0);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
  .capa .para{font-family:var(--display);font-weight:500;font-size:24px;opacity:.9;margin-bottom:22px}
  .capa .tempo{font-size:18px;max-width:20em;opacity:.85}
  .capa .desce{margin-top:30px;width:28px;height:28px;opacity:.7;animation:desce 2s ease-in-out infinite}
  @keyframes desce{50%{transform:translateY(8px)}}

  .carta h2{font-size:34px;margin-bottom:18px}
  .carta p{font-size:19px;line-height:1.65;max-width:28em}

  .continua{min-height:80dvh;display:flex;flex-direction:column;justify-content:center;gap:18px}
  .continua h2{font-size:52px}
  .continua p{font-size:19px;line-height:1.65}
  .falta{font-family:var(--display);font-weight:800;font-size:26px;color:var(--dende);line-height:1.15}
  .aviso{font-size:15px;opacity:.85}

  /* ---------- botões flutuantes ---------- */
  #som-btn,#fab{display:none;position:fixed;z-index:20;border-radius:50%;align-items:center;justify-content:center}
  body[data-state=main] #som-btn,body[data-state=main] #fab{display:flex}
  #som-btn{left:16px;bottom:calc(env(safe-area-inset-bottom) + 18px);width:48px;height:48px;background:rgba(20,10,40,.55);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:#fff;font-size:18px}
  #fab{right:16px;bottom:calc(env(safe-area-inset-bottom) + 18px);width:58px;height:58px;background:var(--dende);font-size:26px;box-shadow:0 8px 22px rgba(0,0,0,.35)}

  /* ---------- sobreposições ---------- */
  .overlay{position:fixed;inset:0;z-index:50;background:rgba(15,8,30,.97);display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:var(--topo) 24px var(--base);text-align:center;overflow:auto}
  .overlay.on{display:flex}
  .overlay h2{font-size:34px}
  .overlay p{max-width:22em;opacity:.88}
  .overlay video{width:100%;max-width:340px;max-height:46dvh;border-radius:20px;background:#000;object-fit:cover}
  .fechar{position:absolute;top:calc(env(safe-area-inset-top) + 12px);right:14px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;font-size:18px}
  #lb img{max-width:100%;max-height:86dvh;border-radius:14px}

  /* ---------- cartão ---------- */
  .pass{
    --stub:132px;background:var(--papel);color:var(--tinta);border-radius:24px;overflow:hidden;box-shadow:0 18px 40px rgba(8,4,24,.45);
    -webkit-mask:radial-gradient(circle 12px at 0 calc(100% - var(--stub)),transparent 97%,#000) left/51% 100% no-repeat,radial-gradient(circle 12px at 100% calc(100% - var(--stub)),transparent 97%,#000) right/51% 100% no-repeat;
            mask:radial-gradient(circle 12px at 0 calc(100% - var(--stub)),transparent 97%,#000) left/51% 100% no-repeat,radial-gradient(circle 12px at 100% calc(100% - var(--stub)),transparent 97%,#000) right/51% 100% no-repeat;
    animation:rise .8s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes rise{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
  .pass-head{background:linear-gradient(90deg,var(--acai),var(--mare));color:#fff;display:flex;justify-content:space-between;align-items:center;padding:14px 20px;font-size:14px;font-weight:600}
  .pass-head .brand{font-size:14px}
  .pass-body{padding:20px 20px 22px}
  .lbl{display:block;font-size:12px;color:var(--muda);margin-bottom:2px}
  .nome{font-family:var(--display);font-weight:800;font-size:25px;line-height:1.1}
  .rota{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;margin:22px 0}
  .cidade b{display:block;font-family:var(--display);font-weight:800;font-size:54px;line-height:.95;letter-spacing:-.02em}
  .cidade span{font-size:14px;color:var(--muda)}
  .cidade.dir{text-align:right}
  .mid{position:relative;height:24px}
  .mid::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:2px dashed rgba(36,22,54,.3)}
  .mid svg{position:absolute;left:50%;top:50%;width:26px;height:26px;transform:translate(-50%,-50%) rotate(90deg);fill:var(--acai);background:var(--papel);padding:0 2px;box-sizing:content-box}
  .grade{display:grid;grid-template-columns:repeat(3,1fr);gap:16px 10px}
  .grade dt{font-size:12px;color:var(--muda)}
  .grade dd{font-weight:600;font-size:17px;line-height:1.2}
  .stub{height:var(--stub);margin:0 14px;border-top:2px dashed rgba(36,22,54,.25);padding:14px 6px 0;display:flex;flex-direction:column;gap:10px}
  .stub svg{width:100%;height:50px;color:var(--tinta)}
  .stub p{font-size:13px;color:var(--muda);text-align:center;line-height:1.3}
  .voos{margin:28px 0 8px}
  .voos h2{font-size:26px;margin-bottom:12px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chips span{border:1.5px solid rgba(255,255,255,.35);border-radius:999px;padding:4px 14px;font-weight:600;font-size:15px}
  .chips span.hoje{border-color:var(--dende);color:var(--dende)}
  .stats{display:flex;gap:28px;margin:22px 0 28px}
  .stats b{display:block;font-family:var(--display);font-weight:800;font-size:34px;line-height:1}
  .stats span{font-size:14px;opacity:.8}

  /* ---------- voo ---------- */
  .map{flex:1;width:100%;max-height:640px}
  .map text{font-family:var(--display);font-weight:800;font-size:30px;fill:#fff}
  .map .sub{font-family:var(--texto);font-weight:400;font-size:14px;opacity:.8}
  #status{font-family:var(--display);font-weight:800;font-size:26px;text-align:center;min-height:2.4em;padding-bottom:20px}

  /* ---------- chegada ---------- */
  .chegada{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;gap:22px;padding-top:var(--topo)}
  .chegada h1{font-size:46px}
  .msg{display:flex;flex-direction:column;gap:14px;font-size:19px;line-height:1.6;max-width:26em}
  .assina{font-family:var(--display);font-weight:800;font-size:22px}
  .carimbo{align-self:flex-start;border:3px solid var(--dende);color:var(--dende);border-radius:14px;padding:8px 16px;font-family:var(--display);font-weight:800;line-height:1.15;font-size:20px;animation:carimbar .5s .3s cubic-bezier(.3,1.6,.5,1) both;transform:rotate(-6deg)}
  .carimbo small{display:block;font-family:var(--texto);font-weight:600;font-size:13px}
  @keyframes carimbar{from{transform:rotate(-6deg) scale(2.2);opacity:0}to{transform:rotate(-6deg) scale(1);opacity:1}}
  .novo h2{font-size:38px;margin-bottom:10px}
  .novo > p{opacity:.85;margin-bottom:22px}
  .vazios{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .vazio{aspect-ratio:4/5;border:2px dashed rgba(255,255,255,.4);border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:12px;text-align:center;font-size:14px;line-height:1.3}
  .vazio i{font-style:normal;font-size:30px;color:var(--dende);line-height:1}
  .fim{padding:60px 0 20px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
  .fim h2{font-size:52px}


  /* ---------- tema vidro ---------- */
  .glass{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);-webkit-backdrop-filter:blur(18px) saturate(150%);backdrop-filter:blur(18px) saturate(150%)}

  #mini{position:fixed;z-index:30;top:calc(env(safe-area-inset-top) + 8px);left:50%;width:min(calc(100% - 24px),400px);height:44px;
    transform:translate(-50%,-160%);opacity:0;pointer-events:none;transition:transform .45s cubic-bezier(.2,.8,.2,1),opacity .3s;
    display:flex;justify-content:space-around;align-items:center;border-radius:999px;font-weight:600;font-size:15px;font-variant-numeric:tabular-nums}
  #mini.on{transform:translate(-50%,0);opacity:1}
  body:not([data-state=main]) #mini{display:none}
  #mini span{display:flex;gap:6px;align-items:center}
  #mini span.d{color:var(--dende)}

  .cap{padding:48px 20px 6px}
  .cap-h{display:flex;align-items:baseline;gap:12px}
  .cap-h .mes{font-family:var(--display);font-weight:800;font-size:76px;line-height:1;letter-spacing:-.04em}
  .cap-h .ano{font-family:var(--display);font-weight:500;font-size:24px;opacity:.65}
  .chip{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--dende);margin:8px 0 2px}
  .chip svg{width:16px;height:16px;fill:var(--dende);transform:rotate(90deg)}
  .resumo{opacity:.85;margin-top:8px}
  .dia{margin-top:24px}
  .data{position:sticky;top:calc(env(safe-area-inset-top) + 60px);z-index:5;width:max-content;margin-bottom:12px;padding:6px 14px;border-radius:999px;
    font-weight:600;font-size:14px;background:rgba(22,10,48,.55);border:1px solid rgba(255,255,255,.18);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
  .card{margin:0 0 16px;border-radius:28px;overflow:hidden;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);box-shadow:0 14px 34px rgba(5,2,20,.35)}
  .foto img{width:100%;height:auto;display:block;cursor:zoom-in;background:rgba(255,255,255,.06)}
  .ph{display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;font-size:14px;opacity:.7;border:2px dashed rgba(255,255,255,.35);white-space:pre-line;aspect-ratio:4/5;width:100%}
  .card figcaption{padding:14px 18px 18px}
  .card h3{font-size:22px;margin-bottom:4px}
  .card p{opacity:.92;font-size:16.5px}

  .surp-card{display:flex;flex-direction:column;gap:6px;text-decoration:none;color:#fff;margin:0 0 16px;padding:18px;border-radius:28px;
    background:linear-gradient(135deg,rgba(244,160,45,.3),rgba(244,160,45,.06));border:1px solid rgba(244,160,45,.6);
    -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);box-shadow:0 0 40px rgba(244,160,45,.18)}
  .surp-card .selo{display:inline-flex;gap:6px;align-items:center;color:var(--dende);font-weight:600;font-size:14px}
  .surp-card .selo svg{width:18px;height:18px;fill:var(--dende)}
  .surp-card b{font-family:var(--display);font-weight:800;font-size:26px;line-height:1.1}
  .surp-card .det{opacity:.85;font-size:15px}
  .surp-card .abrir{margin-top:8px;align-self:flex-start;background:var(--dende);color:var(--tinta);font-weight:600;border-radius:999px;padding:10px 18px;font-size:15px}

  .rv{opacity:0;transform:translateY(26px) scale(.985);transition:opacity .6s ease,transform .7s cubic-bezier(.2,.8,.2,1)}
  .rv.in{opacity:1;transform:none}

  @media (prefers-reduced-motion:reduce){
    .rv{opacity:1;transform:none;transition:none}
    #mini{transition:none}
    .pass,.carimbo,.desce{animation:none}
    .cta{transition:none}
  }
</style>
</head>
<body data-state="gate">
<div id="bg"></div>
<div id="mini" class="glass" aria-label="Nosso tempo"></div>

<!-- ============ Trava com contagem ============ -->
<section id="lock" class="view">
  <div class="centro">
    <div class="cadeado" aria-hidden="true">🔒</div>
    <h1>Ansiosa?</h1>
    <p>O seu presente foi trancado a sete chaves. Ele será revelado automaticamente em:</p>
    <div id="lock-cd"></div>
  </div>
</section>

<!-- ============ Portão ============ -->
<section id="gate" class="view">
  <div class="centro">
    <h1>Acesso restrito</h1>
    <p>Qual é o nosso código secreto?</p>
    <input id="codigo" type="password" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="****" aria-label="Código secreto">
    <div id="erro" role="alert"></div>
  </div>
  <button class="cta" id="btn-codigo">Desbloquear</button>
</section>

<!-- ============ Som ============ -->
<section id="som" class="view">
  <div class="centro">
    <h1>Acesso liberado ✨</h1>
    <p>Aumente o volume do celular para a experiência completa.</p>
  </div>
  <button class="cta" id="btn-play">Dar o play ▶</button>
</section>

<!-- ============ Álbum ============ -->
<main id="main" class="view">
  <section class="capa">
    <h1>Nossos momentos</h1>
    <div class="para" id="para"></div>
    <p class="tempo" id="tempo"></p>
    <svg class="desce" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
  </section>
  <section class="sec carta" id="carta"></section>
  <div id="capitulos"></div>
  <section class="sec continua" id="continua"></section>
</main>

<button id="som-btn" aria-label="Ligar ou desligar a música">🔊</button>
<button id="fab" aria-label="Deu saudade? Toque aqui">🧡</button>

<!-- ============ Cartão ============ -->
<section id="ticket" class="view">
  <div id="pass"></div>
  <div class="voos" id="voos"></div>
  <button class="cta" id="btn-board">Embarcar</button>
  <button class="link" id="btn-voltar-album">Voltar ao álbum</button>
</section>

<!-- ============ Voo ============ -->
<section id="flight" class="view">
  <div class="brand" id="brand-fl"></div>
  <svg class="map" viewBox="0 0 390 600" aria-hidden="true">
    <path id="route" d="M78 120 C 340 90, 70 400, 312 500" fill="none" stroke="#fff" stroke-opacity=".3" stroke-width="2.5" stroke-dasharray="3 9" stroke-linecap="round"/>
    <path id="progress" d="M78 120 C 340 90, 70 400, 312 500" fill="none" stroke="#f4a02d" stroke-width="4" stroke-linecap="round"/>
    <circle cx="78" cy="120" r="7" fill="#f4a02d"/><circle cx="312" cy="500" r="7" fill="#fff"/>
    <text x="78" y="82" text-anchor="middle">BEL</text><text x="78" y="152" text-anchor="middle" class="sub">Belém</text>
    <text x="312" y="552" text-anchor="middle">SSA</text><text x="312" y="578" text-anchor="middle" class="sub">Salvador</text>
    <g id="plane"><path fill="#fff" d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/></g>
  </svg>
  <p id="status" aria-live="polite"></p>
</section>

<!-- ============ Chegada ============ -->
<section id="arrival" class="view">
  <div class="sec chegada" id="chegada"></div>
  <div class="sec novo" id="novo"></div>
</section>

<!-- ============ Sobreposições ============ -->
<div class="overlay" id="saudade" role="dialog" aria-modal="true" aria-label="Sinta o meu abraço">
  <button class="fechar" id="fecha-saudade" aria-label="Fechar">✕</button>
  <h2>Sinta o meu abraço</h2>
  <p id="saudade-txt"></p>
  <video id="saudade-video" playsinline muted loop></video>
</div>
<div class="overlay" id="lb" aria-label="Foto ampliada"><button class="fechar" aria-label="Fechar">✕</button><img alt=""></div>

<script>
/* =====================================================================
   EDITE AQUI. As fotos ficam na mesma pasta deste arquivo (foto01.jpeg...).
   Para testar as trancas antes da data, abra o link com  ?liberar  no fim.
   ===================================================================== */
const CONFIG = {
  nome: "Thayna",
  sobrenome: "SOBRENOME",               // como está na passagem dela
  codigo: "tivoli",
  inicioNamoro: "2026-02-15",

  testeLiberado: true,                  // TESTE: true destranca tudo. Volte para false antes de mandar o link para ela!
  abreEm: "2026-11-15T00:00:00",        // o álbum destranca nos 9 meses

  musica: "musica.mp3",
  musicaSaudade: "musica-saudade.mp3",
  videoSaudade: "video-saudade.mp4",

  carta: [
    "Existem pessoas que entram na nossa vida e, de alguma forma inexplicável, fazem tudo parecer mais leve, mais bonito e mais cheio de sentido. Você é assim para mim. Desde que nossos caminhos se cruzaram, meus dias ganharam mais cor, mais calma e um motivo a mais para sorrir.",
    "Essa carta é apenas uma pequena forma de expressar o quanto você é especial para mim e o quanto sou grato por ter você ao meu lado. Que possamos continuar construindo momentos lindos, colecionando sorrisos e escrevendo juntos uma história cheia de carinho, cumplicidade e amor. Cada segundo com você é um presente."
  ],
  saudade: "Meu amor, minha namorada. Sempre que a saudade apertar, lembre-se que eu estou exatamente aqui. Feche os olhos, ouça a música e sinta que nada no mundo pode diminuir o que sentimos um pelo outro. Te amo!",

  marcos: [
    { emoji: "🤝", titulo: "Nossa amizade",   data: "2025-11-02" },
    { emoji: "✨", titulo: "1º encontro",     data: "2026-01-10" },
    { emoji: "💌", titulo: "1º \"eu te amo\"", data: "2026-01-18" },
    { emoji: "💍", titulo: "Nosso namoro",    data: "2026-02-15", destaque: true }
  ],

const reduzir = matchMedia('(prefers-reduced-motion: reduce)').matches;
const LIBERAR = new URLSearchParams(location.search).has('liberar') || CONFIG.testeLiberado === true;
const AVIAO = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/></svg>';
const C = CONFIG;
const MES_ABR = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const MES_LONGO = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];

/* ---------- cor que viaja de Belém a Salvador ---------- */
const hex = h => [1,3,5].map(i => parseInt(h.slice(i,i+2),16));
const PAL = [hex('#2a1748'), hex('#1d2a5f'), hex('#0f4c75')];
function cor(p){
  p = Math.max(0, Math.min(1, p));
  const s = p * 2, i = Math.min(1, Math.floor(s)), t = s - i;
  const a = PAL[i], b = PAL[i+1];
  return 'rgb(' + a.map((v,k) => Math.round(v + (b[k]-v)*t)).join(',') + ')';
}
function fundo(p){
  $('#bg').style.background = `radial-gradient(60% 38% at 88% 8%,rgba(244,160,45,.20),transparent 70%),radial-gradient(70% 45% at 6% 92%,rgba(40,170,210,.22),transparent 70%),linear-gradient(180deg,${cor(p)},${cor(p+.3)})`;
}

/* ---------- estados ---------- */
function ir(estado){
  document.body.dataset.state = estado;
  window.scrollTo(0,0);
  if (estado === 'main') aoRolar();
  if (estado === 'ticket') fundo(.78);
  if (estado === 'arrival') fundo(1);
  if (estado === 'gate' || estado === 'som' || estado === 'lock') fundo(0);
}
function aoRolar(){
  if (document.body.dataset.state !== 'main') return;
  $('#mini').classList.toggle('on', scrollY > innerHeight * .55);
  const max = document.documentElement.scrollHeight - innerHeight;
  fundo(max > 0 ? scrollY / max * .72 : 0);
}
addEventListener('scroll', aoRolar, {passive:true});

/* ---------- contagens e trancas ---------- */
const aberto = iso => LIBERAR || Date.now() >= new Date(iso).getTime();
function grade(ms){
  const s = Math.max(0, Math.floor(ms/1000));
  const p = [['Dias', Math.floor(s/86400)], ['Hrs', Math.floor(s%86400/3600)], ['Min', Math.floor(s%3600/60)], ['Seg', s%60]];
  return `<div class="cd">${p.map(([l,v]) => `<div><b>${String(v).padStart(2,'0')}</b><span>${l}</span></div>`).join('')}</div>`;
}
function tictac(){
  if (document.body.dataset.state === 'lock'){
    if (aberto(C.abreEm)) ir('gate'); else $('#lock-cd').innerHTML = grade(new Date(C.abreEm) - Date.now());
  }
  const cb = $('#btn-checkin');
  if (cb){
    if (aberto(C.voo.checkinAbre)){
      if (cb.disabled){ cb.disabled = false; cb.textContent = 'Fazer check-in'; $('#checkin-cd').innerHTML = ''; }
    } else $('#checkin-cd').innerHTML = grade(new Date(C.voo.checkinAbre) - Date.now());
  }
}

/* ---------- datas ---------- */
function tempoJuntos(){
  const ini = new Date(C.inicioNamoro + 'T00:00:00'), h = new Date();
  let m = (h.getFullYear()-ini.getFullYear())*12 + h.getMonth() - ini.getMonth();
  let ref = new Date(ini); ref.setMonth(ini.getMonth() + m);
  if (ref > h){ m--; ref = new Date(ini); ref.setMonth(ini.getMonth() + m); }
  const d = Math.floor((h - ref) / 864e5);
  return `${m} ${m===1?'mês':'meses'} e ${d} ${d===1?'dia':'dias'}`;
}
const diasDesde = iso => Math.max(0, Math.floor((Date.now() - new Date(iso + 'T00:00:00')) / 864e5));
function faltam(){
  const dias = Math.ceil((new Date(C.voo.dataISO) - Date.now()) / 864e5);
  if (dias > 1) return `Faltam ${dias} dias para o seu voo.`;
  if (dias === 1) return 'Falta 1 dia para o seu voo.';
  if (dias === 0) return 'O seu voo é hoje.';
  return '';
}

/* ---------- fotos com moldura de reserva ---------- */
window.ph = src => { const d = document.createElement('div'); d.className = 'ph'; d.textContent = 'Foto não encontrada\n' + src; return d; };
const img = (src, alt) => `<img src="${src}" alt="${alt}" loading="lazy" class="zoom" onerror="this.replaceWith(ph('${src}'))">`;

/* ---------- barras do cartão ---------- */
function barras(){
  let x = 0, seed = 1112, s = '';
  const r = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  while (x < 300){
    const w = 1 + Math.floor(r()*4);
    if (r() > .35) s += `<rect x="${x}" width="${w}" height="50"/>`;
    x += w + 1 + Math.floor(r()*2);
  }
  return `<svg viewBox="0 0 300 50" preserveAspectRatio="none" aria-hidden="true" fill="currentColor">${s}</svg>`;
}

/* ---------- capítulos a partir das memórias ---------- */
function capitulos(){
  const lista = C.memorias.map(m => ({tipo:'foto', ...m}));
  C.surpresas.forEach(x => { const [a,mm,d] = x.data.split('-'); lista.push({tipo:'surpresa', ...x, label:`${d}/${mm}/${a}`}); });
  const grupos = {};
  lista.forEach(m => {
    const [d, mm, a] = m.label.split('/');
    const k = `${a}-${mm}`;
    (grupos[k] = grupos[k] || []).push({...m, d: +d, mm: +mm});
  });
  return Object.keys(grupos).sort().map(k => ({k, itens: grupos[k].sort((x,y) => x.d - y.d)}));
}
const PRESENTE = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6h-2.18c.11-.31.18-.65.18-1 0-1.66-1.34-3-3-3-1.05 0-1.96.54-2.5 1.35l-.5.67-.5-.68C10.96 2.54 10.05 2 9 2 7.34 2 6 3.34 6 5c0 .35.07.69.18 1H4c-1.11 0-1.99.89-1.99 2L2 19c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2zm-5-2c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zM9 4c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm11 15H4v-2h16v2zm0-5H4V8h5.08L7 10.83 8.62 12 11 8.76l1-1.36 1 1.36L15.38 12 17 10.83 14.92 8H20v6z"/></svg>';
function cartao(m){
  if (m.tipo === 'surpresa')
    return `<a class="surp-card rv" href="${m.href}" target="_blank" rel="noopener" data-surp><span class="selo">${PRESENTE}Surpresa</span><b>${m.titulo}</b><span class="det">${m.detalhe}</span><span class="abrir">Abrir em nova página</span></a>`;
  const legenda = (m.titulo || m.legenda) ? `<figcaption>${m.titulo ? `<h3>${m.titulo}</h3>` : ''}${m.legenda ? `<p>${m.legenda}</p>` : ''}</figcaption>` : '';
  return `<figure class="card rv"><div class="foto">${img(m.arquivo, 'Memória de ' + m.label)}</div>${legenda}</figure>`;
}

$('#btn-play').onclick = () => { fundoMusica.play().catch(()=>{}); ir('main'); };
$('#som-btn').onclick = () => { mudo = !mudo; mudo ? fundoMusica.pause() : fundoMusica.play().catch(()=>{}); atualizaSom(); };

/* ---------- saudade ---------- */
const sv = $('#saudade-video');
$('#fab').onclick = () => {
  fundoMusica.pause();
  sv.muted = true; sv.src = C.videoSaudade; sv.onerror = () => { sv.style.display = 'none'; };
  sv.play().catch(()=>{});
  musicaSaudade.src = C.musicaSaudade; musicaSaudade.play().catch(()=>{});
  $('#saudade').classList.add('on');
};
$('#fecha-saudade').onclick = () => {
  sv.pause(); sv.removeAttribute('src'); sv.load(); sv.style.display = '';
  musicaSaudade.pause();
  $('#saudade').classList.remove('on');
  if (!mudo) fundoMusica.play().catch(()=>{});
};

/* ---------- surgir ao rolar ---------- */
function revelar(){
  const els = document.querySelectorAll('.rv');
  if (!('IntersectionObserver' in window) || reduzir){ els.forEach(e => e.classList.add('in')); return; }
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } }), {rootMargin:'0px 0px -8% 0px', threshold:.08});
  els.forEach(e => io.observe(e));
}

/* ---------- surpresas em outra página: pausa a música e retoma ao voltar ---------- */
let foiSurpresa = false;
document.addEventListener('click', e => {
  if (e.target.closest && e.target.closest('a[data-surp]')){ fundoMusica.pause(); foiSurpresa = true; }
});
function retomar(){
  if (foiSurpresa && document.visibilityState === 'visible'){
    foiSurpresa = false;
    if (!mudo && document.body.dataset.state === 'main') fundoMusica.play().catch(()=>{});
  }
}
document.addEventListener('visibilitychange', retomar);
addEventListener('pageshow', retomar);

/* ---------- foto ampliada ---------- */
document.addEventListener('click', e => {
  const t = e.target;
  if (t.matches && t.matches('img.zoom')){ $('#lb img').src = t.src; $('#lb').classList.add('on'); }
});
$('#lb').onclick = () => $('#lb').classList.remove('on');

/* ---------- cartão e voo ---------- */
$('#btn-voltar-album').onclick = () => ir('main');
$('#btn-board').onclick = voar;
function voar(){
  ir('flight');
  const rota = $('#route'), prog = $('#progress'), aviao = $('#plane'), status = $('#status');
  const len = rota.getTotalLength();
  prog.style.strokeDasharray = len;
  const dur = reduzir ? 1500 : 6500, t0 = performance.now();
  const fases = [[0,'Decolando de Belém'],[.18,'Em rota para Salvador'],[.78,'Iniciando a descida'],[.97,'Pouso em Salvador']];
  const lim = v => Math.max(0, Math.min(len, v));
  function passo(agora){
    const p = Math.min((agora - t0) / dur, 1);
    const e = p < .5 ? 2*p*p : 1 - Math.pow(-2*p + 2, 2) / 2;
    const d = e * len;
    const a = rota.getPointAtLength(lim(d-1)), b = rota.getPointAtLength(lim(d+1)), pt = rota.getPointAtLength(d);
    const ang = Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI;
    aviao.setAttribute('transform', `translate(${pt.x} ${pt.y}) rotate(${ang+90}) translate(-12 -12)`);
    prog.style.strokeDashoffset = len * (1 - e);
    fundo(.78 + .22 * e);
    status.textContent = fases.filter(f => p >= f[0]).pop()[1];
    if (p < 1) requestAnimationFrame(passo); else setTimeout(() => ir('arrival'), 900);
  }
  requestAnimationFrame(passo);
}

montar(); atualizaSom();
ir(aberto(C.abreEm) ? 'gate' : 'lock');
tictac(); setInterval(tictac, 1000);
</script>
