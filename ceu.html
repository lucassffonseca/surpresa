<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nosso Universo - 3 Meses 🌌</title>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700;800&family=Dancing+Script:wght@700&family=Inter:wght@300;400;600&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { overflow: hidden; height: 100vh; width: 100vw; background-color: #000; color: #fff; font-family: 'Inter', sans-serif; }
        
        /* Câmera de fundo */
        #ar-camera-feed { position: absolute; inset: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: 0; opacity: 0; transition: opacity 1s; }

        /* --- TELA DE INÍCIO --- */
        #start-screen {
            position: fixed; inset: 0; z-index: 50000;
            background: linear-gradient(to bottom, #050505, #1a0a00);
            display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;
            padding: 30px; transition: opacity 1.5s ease, visibility 1.5s;
        }
        .start-title { font-family: 'Dancing Script', cursive; font-size: 50px; color: #FF6A00; margin-bottom: 15px; text-shadow: 0 0 20px rgba(255,106,0,0.4); }
        .start-text { font-size: 15px; color: #ccc; line-height: 1.6; max-width: 320px; margin-bottom: 40px; font-weight: 300; }
        .start-btn {
            background: linear-gradient(135deg, #FF6A00, #FF9900); color: #fff; border: none; padding: 18px 40px; border-radius: 50px;
            font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 14px; text-transform: uppercase; letter-spacing: 2px;
            cursor: pointer; box-shadow: 0 10px 30px rgba(255,106,0,0.5); animation: pulseBtn 2s infinite;
        }
        @keyframes pulseBtn { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }

        /* --- HUD --- */
        .ui-hud {
            position: fixed; top: 50px; width: 100%; text-align: center; z-index: 10;
            pointer-events: none; opacity: 0; transition: opacity 1s;
        }
        .ui-hud.visible { opacity: 1; }
        .hud-title { font-family: 'Dancing Script', cursive; font-size: 38px; color: #fff; text-shadow: 0 2px 10px rgba(0,0,0,0.8); margin-bottom: 5px; }
        #hud-instruction { font-family: 'Montserrat', sans-serif; font-size: 11px; text-transform: uppercase; letter-spacing: 3px; color: #FF9900; text-shadow: 0 1px 5px rgba(0,0,0,0.8); transition: color 0.5s; }

        /* --- BOTÃO DE EMERGÊNCIA (Failsafe) --- */
        #force-sky-btn {
            position: fixed; bottom: 50px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.6); border: 1px solid #FFD700; color: #FFD700;
            padding: 12px 25px; border-radius: 50px; font-family: 'Montserrat', sans-serif; font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 2px;
            cursor: pointer; z-index: 20; display: none; backdrop-filter: blur(5px);
            box-shadow: 0 0 15px rgba(255,215,0,0.3); animation: fadeInBtn 1s forwards;
        }
        @keyframes fadeInBtn { from { opacity: 0; transform: translate(-50%, 20px); } to { opacity: 1; transform: translate(-50%, 0); } }

        /* --- CONSTELAÇÃO --- */
        #constellation-container {
            position: absolute; inset: 0; z-index: 5;
            opacity: 0; visibility: hidden; transition: opacity 1s, visibility 1s;
            pointer-events: none;
        }
        /* Quando ativo pelos sensores */
        #constellation-container.active { 
            opacity: 1; visibility: visible; pointer-events: auto; 
        }

        .constellation-lines { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        .line { stroke: rgba(255, 153, 0, 0.6); stroke-width: 2.5; stroke-dasharray: 5 5; } /* Linhas mais sólidas */

        .star {
            position: absolute; width: 50px; height: 50px; background: transparent;
            border-radius: 50%; transform: translate(-50%, -50%); cursor: pointer;
            animation: starFloat 4s infinite ease-in-out alternate;
            display: flex; justify-content: center; align-items: center;
        }
        .star::after {
            content: ''; position: absolute; width: 10px; height: 10px; background: #fff; border-radius: 50%;
            box-shadow: 0 0 15px 5px currentColor, 0 0 30px 10px currentColor;
        }

        #star1 { top: 35%; left: 25%; color: #FFD700; animation-delay: 0s; }
        #star2 { top: 45%; left: 75%; color: #FF6A00; animation-delay: -1s; }
        #star3 { top: 70%; left: 45%; color: #00e5ff; animation-delay: -2s; }

        @keyframes starFloat {
            0% { transform: translate(-50%, -50%) scale(0.9); }
            100% { transform: translate(-50%, -55%) scale(1.1); }
        }

        /* --- PAINEL DA MEMÓRIA --- */
        #memory-overlay {
            position: fixed; inset: 0; z-index: 10000;
            background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            display: flex; justify-content: center; align-items: center;
            opacity: 0; visibility: hidden; transition: all 0.4s ease;
        }
        #memory-overlay.active { opacity: 1; visibility: visible; }

        .memory-card {
            background: linear-gradient(to bottom, rgba(255,255,255,0.05), rgba(0,0,0,0.95));
            border: 1px solid rgba(255, 106, 0, 0.4); border-radius: 20px;
            width: 85%; max-width: 380px; padding: 30px 25px; text-align: center;
            transform: translateY(30px) scale(0.95); transition: all 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
            box-shadow: 0 30px 60px rgba(0,0,0,0.9);
            display: flex; flex-direction: column; align-items: center;
        }
        #memory-overlay.active .memory-card { transform: translateY(0) scale(1); }

        .mem-month { font-family: 'Montserrat', sans-serif; font-size: 11px; color: #FF9900; text-transform: uppercase; letter-spacing: 3px; font-weight: 800; margin-bottom: 8px;}
        .mem-title { font-family: 'Dancing Script', cursive; font-size: 34px; color: #fff; text-shadow: 0 2px 5px rgba(0,0,0,0.5); margin-bottom: 20px;}
        .mem-photo { width: 100%; max-height: 220px; object-fit: cover; border-radius: 12px; border: 1px solid rgba(255,106,0,0.3); margin-bottom: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.6); }
        .mem-text { font-size: 15px; line-height: 1.6; color: #e0e0e0; font-weight: 300; font-style: italic; margin-bottom: 30px;}

        .close-btn {
            background: rgba(255,106,0,0.1); border: 1px solid #FF6A00; color: #fff;
            padding: 12px 30px; border-radius: 50px; font-family: 'Montserrat', sans-serif; font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 1px;
            cursor: pointer; transition: all 0.3s;
        }
        .close-btn:hover { background: #FF6A00; box-shadow: 0 0 15px rgba(255,106,0,0.5); }
    </style>
</head>
<body>

    <audio id="bg-music" loop preload="auto">
        <source src="musica-3meses.mp3" type="audio/mpeg">
    </audio>

    <video id="ar-camera-feed" autoplay playsinline muted></video>

    <div id="start-screen">
        <h1 class="start-title">Nosso Céu</h1>
        <p class="start-text">Para esta surpresa funcionar, precisamos acessar a câmera e os sensores do seu celular.</p>
        <button class="start-btn" onclick="startExperience()">Permitir</button>
    </div>

    <div class="ui-hud" id="hud">
        <h2 class="hud-title">Nossa História</h2>
        <div id="hud-instruction">Iniciando Universo...</div>
    </div>
    
    <button id="force-sky-btn" onclick="forceSkyActivation()">Revelar Estrelas</button>

    <div id="constellation-container">
        <svg class="constellation-lines" width="100%" height="100%">
            <line class="line" x1="25%" y1="35%" x2="75%" y2="45%" />
            <line class="line" x1="75%" y1="45%" x2="45%" y2="70%" />
        </svg>

        <div class="star" id="star1" onclick="openMemory(1)"></div>
        <div class="star" id="star2" onclick="openMemory(2)"></div>
        <div class="star" id="star3" onclick="openMemory(3)"></div>
    </div>

    <div id="memory-overlay">
        <div class="memory-card">
