<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nosso Céu - 3 Meses 🎉</title>
    
    <meta name="theme-color" content="#000000">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;800;900&family=Dancing+Script:wght@700&family=Inter:wght@300;400;600&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { overflow: hidden; height: 100vh; width: 100vw; background-color: #000; color: #fff; font-family: 'Inter', sans-serif; }
        
        #ar-camera-feed { position: absolute; inset: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: 0; }
        #webgl-canvas { position: absolute; inset: 0; z-index: 1; pointer-events: none; }

        /* --- TELA DE BOAS VINDAS --- */
        #start-screen {
            position: fixed; inset: 0; z-index: 50000;
            background: linear-gradient(to bottom, #050505, #1a0a00);
            display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;
            padding: 30px; transition: opacity 1.5s ease, visibility 1.5s;
        }
        .start-title { font-family: 'Dancing Script', cursive; font-size: 46px; color: #FF6A00; margin-bottom: 10px; text-shadow: 0 0 20px rgba(255,106,0,0.4); }
        .start-text { font-size: 15px; color: #ccc; line-height: 1.6; max-width: 320px; margin-bottom: 40px; font-weight: 300; }
        .start-btn {
            background: linear-gradient(135deg, #FF6A00, #FF9900); color: #fff; border: none; padding: 18px 40px; border-radius: 50px;
            font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 14px; text-transform: uppercase; letter-spacing: 2px;
            cursor: pointer; box-shadow: 0 10px 30px rgba(255,106,0,0.5); animation: pulseBtn 2s infinite;
        }
        @keyframes pulseBtn { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }

        /* --- HUD (INTERFACE) --- */
        .ui-hud {
            position: fixed; top: 40px; width: 100%; text-align: center; z-index: 10;
            pointer-events: none; opacity: 0; transition: opacity 2s ease 1s;
        }
        .ui-hud.visible { opacity: 1; }
        .hud-title { font-family: 'Dancing Script', cursive; font-size: 36px; color: #fff; text-shadow: 0 2px 10px rgba(0,0,0,0.8); }
        .hud-sub { font-family: 'Montserrat', sans-serif; font-size: 10px; text-transform: uppercase; letter-spacing: 3px; color: #FF9900; opacity: 0.9;}

        /* ÁREA DE CLIQUE (SEM MIRA) */
        #click-layer { position: absolute; inset: 0; z-index: 5; }

        /* Animação para instruir a olhar para cima */
        .look-up-guide {
            position: fixed; bottom: 15%; left: 50%; transform: translateX(-50%);
            display: flex; flex-direction: column; align-items: center; z-index: 10;
            opacity: 0; transition: opacity 1s; pointer-events: none;
        }
        .look-up-guide.visible { opacity: 1; animation: fadeOut 8s forwards; }
        .arrow-up { font-size: 30px; animation: bounceUp 1.5s infinite; color: rgba(255,106,0,0.8); }
        .guide-text { font-size: 12px; text-transform: uppercase; letter-spacing: 2px; margin-top: 5px; color: rgba(255,255,255,0.8); }
        
        @keyframes bounceUp { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
        @keyframes fadeOut { 0%, 80% { opacity: 1; } 100% { opacity: 0; visibility: hidden; } }

        /* ==========================================
           PAINEL DA MEMÓRIA
           ========================================== */
        #memory-overlay {
            position: fixed; inset: 0; z-index: 10000;
            background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            display: flex; justify-content: center; align-items: center;
            opacity: 0; visibility: hidden; transition: all 0.6s ease;
        }
        #memory-overlay.active { opacity: 1; visibility: visible; }

        .memory-card {
            background: linear-gradient(to bottom, rgba(255,255,255,0.1), rgba(0,0,0,0.85) 90%);
            border: 1px solid rgba(255, 106, 0, 0.4); border-radius: 24px;
            width: 88%; max-width: 360px; padding: 25px; text-align: center;
            transform: translateY(30px) scale(0.95); transition: all 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
            box-shadow: 0 30px 60px rgba(0,0,0,0.9);
            display: flex; flex-direction: column; align-items: center;
        }
        #memory-overlay.active .memory-card { transform: translateY(0) scale(1); }

        .mem-month { font-family: 'Montserrat', sans-serif; font-size: 11px; color: #FF9900; text-transform: uppercase; letter-spacing: 3px; font-weight: 800; margin-bottom: 5px;}
        .mem-title { font-family: 'Dancing Script', cursive; font-size: 32px; color: #fff; text-shadow: 0 2px 5px rgba(0,0,0,0.5); margin-bottom: 15px;}

        .mem-photo {
            width: 100%; max-height: 200px; object-fit: cover; border-radius: 12px;
            border: 2px solid rgba(255,106,0,0.3); margin-bottom: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        .mem-text { font-size: 14px; line-height: 1.6; color: #e0e0e0; font-weight: 300; font-style: italic; margin-bottom: 25px; padding: 0 5px;}

        .close-btn {
            background: rgba(255,106,0,0.1); border: 1px solid #FF6A00; color: #fff;
            padding: 12px 30px; border-radius: 50px; font-family: 'Inter', sans-serif; font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 1px;
            cursor: pointer; transition: all 0.3s;
        }
        .close-btn:hover { background: #FF6A00; }
    </style>
</head>
<body>

    <audio id="bg-music" loop preload="auto">
        <source src="musica-3meses.mp3" type="audio/mpeg">
    </audio>

    <video id="ar-camera-feed" autoplay playsinline muted></video>

    <div id="start-screen">
        <h1 class="start-title">Nosso Céu</h1>
        <p class="start-text">Permita o acesso à câmera e aos sensores. Depois, olhe para cima e procure as constelações da nossa história.</p>
        <button class="start-btn" onclick="startExperience()">Permitir e Começar</button>
    </div>

    <div class="ui-hud" id="hud">
        <h2 class="hud-title">3 Meses Juntos</h2>
        <div class="hud-sub">Toque nas estrelas para abrir</div>
    </div>
    
    <div class="look-up-guide" id="guide">
        <div class="arrow-up">⇧</div>
        <div class="guide-text">Aponte para o alto</div>
    </div>

    <div id="click-layer" style="display: none;"></div>

    <canvas id="webgl-canvas"></canvas>

    <div id="memory-overlay">
        <div class="memory-card">
            <div class="mem-month" id="mem-month">Março de 2026</div>
            <h2 class="mem-title" id="mem-title">O Começo</h2>
            <img src="" alt="Nossa Memória" id="mem-photo" class="mem-photo">
            <p class="mem-text" id="mem-text">Texto...</p>
            <button class="close-btn" onclick="closeMemory()">Voltar a Procurar</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // ==========================================
        // DADOS E POSIÇÕES AGRUPADAS (Z negativo, Y alto)
        // ==========================================
        const memorias = [
            {
                id: 1, month: "Março de 2026", title: "O Início",
                text: "Onde as cartinhas começaram e a distância percebeu que tinha arranjado um problema sério. Nosso primeiro mês provou que nossa conexão vai além da geografia.",
                color: 0xFFD700, imageUrl: "foto01.jpeg",
                // Mais próximas entre si e levemente inclinadas para cima
                pos: { x: -40, y: 120, z: -80 } 
            },
            {
                id: 2, month: "Abril de 2026", title: "A Nossa Luz",
                text: "O mês dos girassóis. Encontramos nosso ritmo, dividimos nossos cafés e construímos o nosso porto seguro. Você iluminou meus dias.",
                color: 0xFF6A00, imageUrl: "foto02.jpegg",
                // A estrela central mais alta
                pos: { x: 0, y: 150, z: -100 }
            },
            {
                id: 3, month: "Maio de 2026", title: "O Nosso Universo",
                text: "Três meses. Hoje o nosso amor não cabe mais em um diário ou numa tela, ele encontrou espaço no céu aberto da Realidade Aumentada. Te amo!",
                color: 0x00e5ff, imageUrl: "foto03.jpeg",
                pos: { x: 40, y: 130, z: -70 }
            }
        ];

        let scene, camera, renderer, raycaster, mouse;
        let memoryStarsGroup = new THREE.Group();
        let isGyroEnabled = false;

        function initScene() {
            const canvas = document.getElementById('webgl-canvas');
            scene = new THREE.Scene();
            scene.background = null; // Fundo transparente

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
            renderer.setClearColor(0x000000, 0); 
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);

            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            createMemoryStars();
            drawConstellationLines();
            
            document.getElementById('click-layer').addEventListener('click', onInteract, false);
            document.getElementById('click-layer').addEventListener('touchstart', onInteract, {passive: false});
            window.addEventListener('resize', onWindowResize, false);

            animate();
        }

        function createMemoryStars() {
            memorias.forEach(mem => {
                const coreGeo = new THREE.SphereGeometry(4, 32, 32);
                const coreMat = new THREE.MeshBasicMaterial({ color: mem.color });
                const star = new THREE.Mesh(coreGeo, coreMat);
                
                const haloGeo = new THREE.SphereGeometry(8, 32, 32);
                const haloMat = new THREE.MeshBasicMaterial({ color: mem.color, transparent: true, opacity: 0.6, blending: THREE.AdditiveBlending });
                const halo = new THREE.Mesh(haloGeo, haloMat);
                star.add(halo);

                const haloBigGeo = new THREE.SphereGeometry(18, 32, 32);
                const haloBigMat = new THREE.MeshBasicMaterial({ color: mem.color, transparent: true, opacity: 0.25, blending: THREE.AdditiveBlending });
                const haloBig = new THREE.Mesh(haloBigGeo, haloBigMat);
                star.add(haloBig);

                // CAIXA DE COLISÃO INVISÍVEL GIGANTE PARA FACILITAR O CLIQUE
                const hitBoxGeo = new THREE.SphereGeometry(30, 16, 16);
                const hitBoxMat = new THREE.MeshBasicMaterial({ visible: false }); // Fica invisível
                const hitBox = new THREE.Mesh(hitBoxGeo, hitBoxMat);
                star.add(hitBox);

                star.position.set(mem.pos.x, mem.pos.y, mem.pos.z);
                
                // O Raycaster vai atingir o HitBox, então passamos os dados pra ele
                hitBox.userData = { isMemory: true, data: mem };
                
                // Pra garantir, colocamos na estrela também
                star.userData = { isMemory: true, data: mem, halo: halo, haloBig: haloBig };
                
                memoryStarsGroup.add(star);
            });
            scene.add(memoryStarsGroup);
        }

        // ==========================================
        // LINHAS DA CONSTELAÇÃO
        // ==========================================
        function drawConstellationLines() {
            const material = new THREE.LineBasicMaterial({ color: 0xFF9900, transparent: true, opacity: 0.4 });
            const points = [];
            points.push(new THREE.Vector3(memorias[0].pos.x, memorias[0].pos.y, memorias[0].pos.z));
            points.push(new THREE.Vector3(memorias[1].pos.x, memorias[1].pos.y, memorias[1].pos.z));
            points.push(new THREE.Vector3(memorias[2].pos.x, memorias[2].pos.y, memorias[2].pos.z));
            
            const geometry = new THREE.BufferGeometry().setFromPoints(points);
            const line = new THREE.Line(geometry, material);
            scene.add(line);
        }

        async function startExperience() {
            document.getElementById('bg-music').play().catch(e => console.log(e));

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                document.getElementById('ar-camera-feed').srcObject = stream;
            } catch (err) { console.error("Câmera falhou:", err); }

            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(permissionState => {
                        if (permissionState === 'granted') {
                            window.addEventListener('deviceorientation', handleOrientation);
                            isGyroEnabled = true;
                        }
                    }).catch(console.error);
            } else {
                window.addEventListener('deviceorientation', handleOrientation);
                isGyroEnabled = true;
            }

            document.getElementById('start-screen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('start-screen').style.visibility = 'hidden';
                document.getElementById('hud').classList.add('visible');
                document.getElementById('guide').classList.add('visible'); // Mostra a seta
                document.getElementById('click-layer').style.display = 'block';
                initScene();
            }, 1000);
        }

        function handleOrientation(event) {
            if (!event.alpha || !event.beta || !event.gamma) return;
            const alpha = THREE.MathUtils.degToRad(event.alpha);
            const beta = THREE.MathUtils.degToRad(event.beta);
            const gamma = THREE.MathUtils.degToRad(event.gamma);
            const euler = new THREE.Euler(beta, alpha, -gamma, 'YXZ');
            camera.quaternion.setFromEuler(euler);
        }

        // ==========================================
        // LÓGICA DO CLIQUE / TOQUE DIRETO (SEM MIRA)
        // ==========================================
        function onInteract(event) {
            event.preventDefault();
            
            // Pega a coordenada exata do toque do dedo ou mouse
            if (event.type === 'touchstart') {
                mouse.x = (event.touches[0].clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(event.touches[0].clientY / window.innerHeight) * 2 + 1;
            } else {
                mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            }

            raycaster.setFromCamera(mouse, camera);
            
            // Verifica interseção com os filhos do grupo (incluindo as HitBoxes invisíveis!)
            const intersects = raycaster.intersectObjects(memoryStarsGroup.children, true);

            if (intersects.length > 0) {
                // Pega o primeiro objeto atingido
                let obj = intersects[0].object;
                
                // Verifica se ele ou o "pai" dele tem os dados da memória
                if (obj.userData.isMemory) {
                    openMemory(obj.userData.data);
                } else if (obj.parent && obj.parent.userData.isMemory) {
                    openMemory(obj.parent.userData.data);
                }
            }
        }

        function openMemory(data) {
            document.getElementById('mem-month').innerText = data.month;
            document.getElementById('mem-title').innerText = data.title;
            document.getElementById('mem-text').innerText = data.text;
            
            const memPhoto = document.getElementById('mem-photo');
            memPhoto.src = data.imageUrl; 
            memPhoto.style.display = 'block'; 

            document.getElementById('memory-overlay').classList.add('active');
            document.getElementById('click-layer').style.display = 'none';
        }

        function closeMemory() {
            document.getElementById('memory-overlay').classList.remove('active');
            document.getElementById('click-layer').style.display = 'block';
            setTimeout(() => { document.getElementById('mem-photo').src = ""; }, 600);
        }

        function onWindowResize() {
            if(!camera) return;
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = Date.now() * 0.0035;
            memoryStarsGroup.children.forEach(star => {
                if (star.userData.halo) {
                    const scale1 = 1 + Math.sin(time + star.position.x) * 0.35;
                    const scale2 = 1 + Math.cos(time + star.position.y) * 0.25;
                    star.userData.halo.scale.set(scale1, scale1, scale1);
                    star.userData.haloBig.scale.set(scale2, scale2, scale2);
                }
            });
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
