<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nosso Universo - 3 Meses 🌌</title>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700;800&family=Dancing+Script:wght@700&family=Inter:wght@300;400;600&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { overflow: hidden; height: 100vh; width: 100vw; background-color: #000; color: #fff; font-family: 'Inter', sans-serif; }
        
        /* Câmera de fundo */
        #ar-camera-feed { position: absolute; inset: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: 0; opacity: 0; transition: opacity 2s; }

        /* --- TELA DE INÍCIO --- */
        #start-screen {
            position: fixed; inset: 0; z-index: 50000;
            background: linear-gradient(to bottom, #050505, #1a0a00);
            display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;
            padding: 30px; transition: opacity 1.5s ease, visibility 1.5s;
        }
        .start-title { font-family: 'Dancing Script', cursive; font-size: 50px; color: #FF6A00; margin-bottom: 15px; text-shadow: 0 0 20px rgba(255,106,0,0.4); }
        .start-text { font-size: 15px; color: #ccc; line-height: 1.6; max-width: 320px; margin-bottom: 40px; font-weight: 300; }
        .start-btn {
            background: linear-gradient(135deg, #FF6A00, #FF9900); color: #fff; border: none; padding: 18px 40px; border-radius: 50px;
            font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 14px; text-transform: uppercase; letter-spacing: 2px;
            cursor: pointer; box-shadow: 0 10px 30px rgba(255,106,0,0.5); animation: pulseBtn 2s infinite;
        }
        @keyframes pulseBtn { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }

        /* --- HUD (Textos na tela AR) --- */
        .ui-hud {
            position: fixed; top: 50px; width: 100%; text-align: center; z-index: 10;
            pointer-events: none; opacity: 0; transition: opacity 2s ease 1s;
        }
        .ui-hud.visible { opacity: 1; }
        .hud-title { font-family: 'Dancing Script', cursive; font-size: 42px; color: #fff; text-shadow: 0 2px 15px rgba(0,0,0,0.9); }
        .hud-sub { font-family: 'Montserrat', sans-serif; font-size: 11px; text-transform: uppercase; letter-spacing: 3px; color: #FF9900; opacity: 0.9; text-shadow: 0 1px 5px rgba(0,0,0,0.9); margin-top: 5px;}

        /* --- A CONSTELAÇÃO MÁGICA (CSS PURO) --- */
        #constellation-container {
            position: absolute; inset: 0; z-index: 5;
            opacity: 0; transition: opacity 3s;
        }
        #constellation-container.visible { opacity: 1; }

        /* Linhas ligando as estrelas */
        .constellation-lines {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;
        }
        .line { stroke: rgba(255, 153, 0, 0.4); stroke-width: 2; stroke-dasharray: 5 5; }

        /* As Estrelas */
        .star {
            position: absolute; width: 24px; height: 24px; background: #fff;
            border-radius: 50%; transform: translate(-50%, -50%); cursor: pointer;
            box-shadow: 0 0 20px 10px rgba(255, 255, 255, 0.2);
            animation: starFloat 4s infinite ease-in-out alternate;
        }
        .star::after {
            content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 8px; height: 8px; background: #fff; border-radius: 50%;
            box-shadow: 0 0 15px 5px currentColor;
        }

        /* Cores e Posições Fixas na Tela */
        #star1 { top: 35%; left: 25%; color: #FFD700; box-shadow: 0 0 30px 15px rgba(255, 215, 0, 0.3); animation-delay: 0s; }
        #star2 { top: 45%; left: 75%; color: #FF6A00; box-shadow: 0 0 30px 15px rgba(255, 106, 0, 0.3); animation-delay: -1s; }
        #star3 { top: 70%; left: 45%; color: #00e5ff; box-shadow: 0 0 30px 15px rgba(0, 229, 255, 0.3); animation-delay: -2s; }

        @keyframes starFloat {
            0% { transform: translate(-50%, -50%) scale(0.9); }
            100% { transform: translate(-50%, -60%) scale(1.1); }
        }

        /* --- PAINEL DA MEMÓRIA --- */
        #memory-overlay {
            position: fixed; inset: 0; z-index: 10000;
            background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            display: flex; justify-content: center; align-items: center;
            opacity: 0; visibility: hidden; transition: all 0.4s ease;
        }
        #memory-overlay.active { opacity: 1; visibility: visible; }

        .memory-card {
            background: linear-gradient(to bottom, rgba(255,255,255,0.05), rgba(0,0,0,0.95));
            border: 1px solid rgba(255, 106, 0, 0.4); border-radius: 20px;
            width: 85%; max-width: 380px; padding: 30px 25px; text-align: center;
            transform: translateY(30px) scale(0.95); transition: all 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
            box-shadow: 0 30px 60px rgba(0,0,0,0.9);
            display: flex; flex-direction: column; align-items: center;
        }
        #memory-overlay.active .memory-card { transform: translateY(0) scale(1); }

        .mem-month { font-family: 'Montserrat', sans-serif; font-size: 11px; color: #FF9900; text-transform: uppercase; letter-spacing: 3px; font-weight: 800; margin-bottom: 8px;}
        .mem-title { font-family: 'Dancing Script', cursive; font-size: 34px; color: #fff; text-shadow: 0 2px 5px rgba(0,0,0,0.5); margin-bottom: 20px;}
        .mem-photo { width: 100%; max-height: 220px; object-fit: cover; border-radius: 12px; border: 1px solid rgba(255,106,0,0.3); margin-bottom: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.6); }
        .mem-text { font-size: 15px; line-height: 1.6; color: #e0e0e0; font-weight: 300; font-style: italic; margin-bottom: 30px;}

        .close-btn {
            background: rgba(255,106,0,0.1); border: 1px solid #FF6A00; color: #fff;
            padding: 12px 30px; border-radius: 50px; font-family: 'Montserrat', sans-serif; font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 1px;
            cursor: pointer; transition: all 0.3s;
        }
        .close-btn:hover { background: #FF6A00; box-shadow: 0 0 15px rgba(255,106,0,0.5); }
    </style>
</head>
<body>

    <audio id="bg-music" loop preload="auto">
        <source src="musica-3meses.mp3" type="audio/mpeg">
    </audio>

    <video id="ar-camera-feed" autoplay playsinline muted></video>

    <div id="start-screen">
        <h1 class="start-title">Nosso Céu</h1>
        <p class="start-text">Aponte a câmera do seu celular para o céu e descubra o que o universo guardou para nós.</p>
        <button class="start-btn" onclick="startExperience()">Abrir Câmera</button>
    </div>

    <div class="ui-hud" id="hud">
        <h2 class="hud-title">3 Meses de Nós</h2>
        <div class="hud-sub">Toque nas estrelas do nosso céu</div>
    </div>
    
    <div id="constellation-container">
        <svg class="constellation-lines" width="100%" height="100%">
            <line class="line" x1="25%" y1="35%" x2="75%" y2="45%" />
            <line class="line" x1="75%" y1="45%" x2="45%" y2="70%" />
        </svg>

        <div class="star" id="star1" onclick="openMemory(1)"></div>
        <div class="star" id="star2" onclick="openMemory(2)"></div>
        <div class="star" id="star3" onclick="openMemory(3)"></div>
    </div>

    <div id="memory-overlay">
        <div class="memory-card">
            <div class="mem-month" id="mem-month">Mês</div>
            <h2 class="mem-title" id="mem-title">Título</h2>
            <img src="" alt="Nossa Memória" id="mem-photo" class="mem-photo">
            <p class="mem-text" id="mem-text">Texto...</p>
            <button class="close-btn" onclick="closeMemory()">Voltar ao Céu</button>
        </div>
    </div>

    <script>
        // Banco de Dados das Memórias
        const memorias = {
            1: {
                month: "Mês 1", title: "O Início", 
                text: "Onde tudo começou. O primeiro mês nos provou que o que sentimos vai além de qualquer distância.",
                imageUrl: "foto1_3meses.jpg"
            },
            2: {
                month: "Mês 2", title: "A Nossa Luz",
                text: "Encontramos nosso ritmo e construímos o nosso porto seguro. Você iluminou meus dias.",
                imageUrl: "foto2_3meses.jpg"
            },
            3: {
                month: "Mês 3", title: "Nosso Futuro",
                text: "Hoje o nosso amor não cabe mais na tela, ele encontrou espaço no universo. Obrigado por esses 3 meses. Te amo, Thayna!",
                imageUrl: "foto3_3meses.jpg"
            }
        };

        // Inicia a Câmera e a Experiência
        async function startExperience() {
            // Toca a música
            document.getElementById('bg-music').play().catch(e => console.log(e));

            // Pede acesso à câmera traseira
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                const videoFeed = document.getElementById('ar-camera-feed');
                videoFeed.srcObject = stream;
                
                // Exibe o vídeo assim que estiver pronto
                videoFeed.onloadedmetadata = () => {
                    videoFeed.style.opacity = '1';
                };
            } catch (err) { 
                console.error("Câmera negada ou não disponível:", err); 
                // Se der erro, o fundo fica preto e a constelação funciona normalmente.
            }

            // Animação de transição das telas
            document.getElementById('start-screen').style.opacity = '0';
            
            setTimeout(() => {
                document.getElementById('start-screen').style.visibility = 'hidden';
                document.getElementById('hud').classList.add('visible');
                document.getElementById('constellation-container').classList.add('visible');
            }, 1000);
        }

        // Abre o Modal com a Foto e Texto
        function openMemory(id) {
            const data = memorias[id];
            
            document.getElementById('mem-month').innerText = data.month;
            document.getElementById('mem-title').innerText = data.title;
            document.getElementById('mem-text').innerText = data.text;
            document.getElementById('mem-photo').src = data.imageUrl; 
            
            document.getElementById('memory-overlay').classList.add('active');
        }

        // Fecha o Modal
        function closeMemory() {
            document.getElementById('memory-overlay').classList.remove('active');
            
            // Limpa a foto depois que o modal fechar
            setTimeout(() => { document.getElementById('mem-photo').src = ""; }, 400);
        }
    </script>
</body>
</html>
