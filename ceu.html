<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nosso Céu - 3 Meses 🧡</title>
    
    <meta name="theme-color" content="#000000">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;800;900&family=Dancing+Script:wght@700&family=Inter:wght@300;400;600&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { overflow: hidden; height: 100vh; width: 100vw; background-color: #000; color: #fff; font-family: 'Inter', sans-serif; }
        
        /* CÂMERA DO CELULAR (FUNDO REAL) */
        #ar-camera-feed {
            position: absolute; inset: 0;
            width: 100vw; height: 100vh;
            object-fit: cover; /* Faz a câmera preencher toda a tela sem distorcer */
            z-index: 0;
        }

        /* CANVAS 3D (TRANSPARENTE POR CIMA DA CÂMERA) */
        #webgl-canvas { position: absolute; inset: 0; z-index: 1; pointer-events: none; }

        /* TELA DE BOAS VINDAS (PERMISSÃO DE CÂMERA E GIROSCÓPIO) */
        #start-screen {
            position: fixed; inset: 0; z-index: 50000;
            background: linear-gradient(to bottom, #050505, #1a0a00);
            display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;
            padding: 30px; transition: opacity 1.5s ease, visibility 1.5s;
        }

        .start-title { font-family: 'Dancing Script', cursive; font-size: 46px; color: #FF6A00; margin-bottom: 10px; text-shadow: 0 0 20px rgba(255,106,0,0.4); }
        .start-text { font-size: 15px; color: #ccc; line-height: 1.6; max-width: 320px; margin-bottom: 40px; font-weight: 300; }
        
        .start-btn {
            background: linear-gradient(135deg, #FF6A00, #FF9900); color: #fff; border: none; padding: 18px 40px; border-radius: 50px;
            font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 14px; text-transform: uppercase; letter-spacing: 2px;
            cursor: pointer; box-shadow: 0 10px 30px rgba(255,106,0,0.5); animation: pulseBtn 2s infinite;
        }
        @keyframes pulseBtn { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }

        /* HUD (INTERFACE) */
        .ui-hud {
            position: fixed; top: 40px; width: 100%; text-align: center; z-index: 10;
            pointer-events: none; opacity: 0; transition: opacity 2s ease 1s;
        }
        .ui-hud.visible { opacity: 1; }
        .hud-title { font-family: 'Dancing Script', cursive; font-size: 36px; color: #fff; text-shadow: 0 2px 10px rgba(0,0,0,0.8); }
        .hud-sub { font-family: 'Montserrat', sans-serif; font-size: 10px; text-transform: uppercase; letter-spacing: 3px; color: #FF9900; opacity: 0.9; text-shadow: 0 1px 5px rgba(0,0,0,0.8);}

        /* MIRA E ÁREA DE CLIQUE */
        #click-layer {
            position: absolute; inset: 0; z-index: 5; cursor: pointer;
        }
        .crosshair {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 50px; height: 50px; border: 1px solid rgba(255,255,255,0.4); border-radius: 50%;
            z-index: 10; pointer-events: none; display: flex; justify-content: center; align-items: center;
        }
        .crosshair::after { content: ''; width: 4px; height: 4px; background: rgba(255,106,0,1); border-radius: 50%; box-shadow: 0 0 10px rgba(255,106,0,1); }

        /* PAINEL DA MEMÓRIA */
        #memory-overlay {
            position: fixed; inset: 0; z-index: 10000;
            background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            display: flex; justify-content: center; align-items: center;
            opacity: 0; visibility: hidden; transition: all 0.6s ease;
        }
        #memory-overlay.active { opacity: 1; visibility: visible; }

        .memory-card {
            background: linear-gradient(to bottom, rgba(255,255,255,0.1), rgba(0,0,0,0.85));
            border: 1px solid rgba(255, 106, 0, 0.4); border-radius: 24px;
            width: 85%; max-width: 350px; padding: 40px 30px; text-align: center;
            transform: translateY(30px) scale(0.95); transition: all 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
            box-shadow: 0 30px 60px rgba(0,0,0,0.9);
        }
        #memory-overlay.active .memory-card { transform: translateY(0) scale(1); }

        .mem-month { font-family: 'Montserrat', sans-serif; font-size: 12px; color: #FF9900; text-transform: uppercase; letter-spacing: 3px; margin-bottom: 10px; font-weight: 800; }
        .mem-title { font-family: 'Dancing Script', cursive; font-size: 38px; color: #fff; margin-bottom: 20px; text-shadow: 0 2px 5px rgba(0,0,0,0.5); }
        .mem-text { font-size: 15px; line-height: 1.7; color: #e0e0e0; font-weight: 300; font-style: italic; margin-bottom: 30px; }

        .close-btn {
            background: rgba(255,106,0,0.1); border: 1px solid #FF6A00; color: #fff;
            padding: 12px 30px; border-radius: 50px; font-family: 'Inter', sans-serif; font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 1px;
            cursor: pointer; transition: all 0.3s;
        }
        .close-btn:hover { background: #FF6A00; }
    </style>
</head>
<body>

    <audio id="bg-music" loop preload="auto">
        <source src="musica-3meses.mp3" type="audio/mpeg">
    </audio>

    <video id="ar-camera-feed" autoplay playsinline muted></video>

    <div id="start-screen">
        <h1 class="start-title">Nosso Céu</h1>
        <p class="start-text">Para esta surpresa, permita o acesso à câmera e aos sensores. Depois, aponte seu celular para o céu e procure nossas memórias flutuando no ar.</p>
        <button class="start-btn" onclick="startExperience()">Permitir e Começar</button>
    </div>

    <div class="ui-hud" id="hud">
        <h2 class="hud-title">3 Meses de Nós</h2>
        <div class="hud-sub">Aponte para cima e procure</div>
    </div>
    
    <div id="click-layer" style="display: none;"></div>
    <div class="crosshair" id="crosshair" style="display: none;"></div>

    <canvas id="webgl-canvas"></canvas>

    <div id="memory-overlay">
        <div class="memory-card">
            <div class="mem-month" id="mem-month">Mês 1</div>
            <h2 class="mem-title" id="mem-title">Título</h2>
            <p class="mem-text" id="mem-text">Texto...</p>
            <button class="close-btn" onclick="closeMemory()">Voltar a Procurar</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        const memorias = [
            {
                id: 1, month: "15 de Março", title: "O Começo de Tudo",
                text: "Onde as cartinhas começaram e a distância percebeu que tinha arranjado um problema sério com a gente. Nosso primeiro mês provou que a conexão vai muito além da geografia.",
                color: 0xFFD700, 
                // Y positivo significa "para cima" no espaço 3D
                pos: { x: -60, y: 150, z: -100 } 
            },
            {
                id: 2, month: "15 de Abril", title: "A Nossa Luz",
                text: "O mês dos girassóis. Encontramos nosso ritmo, dividimos nossos cafés e construímos o nosso porto seguro. Você iluminou todos os meus dias.",
                color: 0xFF6A00, 
                pos: { x: 120, y: 100, z: -40 }
            },
            {
                id: 3, month: "15 de Maio", title: "O Nosso Universo",
                text: "Três meses. Hoje o nosso amor não cabe mais em um quarto de hotel ou numa tela de celular, ele encontrou espaço no céu aberto. Te amo, minha Thayna!",
                color: 0x00e5ff, // Um azul/ciano para dar contraste
                pos: { x: 20, y: 180, z: 80 }
            }
        ];

        let scene, camera, renderer, raycaster, mouse;
        let memoryStarsGroup = new THREE.Group();
        let isGyroEnabled = false;

        function initScene() {
            const canvas = document.getElementById('webgl-canvas');
            scene = new THREE.Scene();
            
            // FUNDO TRANSPARENTE: O segredo para o AR funcionar!
            scene.background = null; 

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            // alpha: true permite que a tag <video> apareça por trás
            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
            renderer.setClearColor(0x000000, 0); 
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);

            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            createMemoryStars();
            
            // Adicionando um pouco de "poeira mágica" perto das estrelas pra chamar atenção na câmera
            createMagicDust();

            document.getElementById('click-layer').addEventListener('click', onInteract, false);
            document.getElementById('click-layer').addEventListener('touchstart', onInteract, {passive: false});
            window.addEventListener('resize', onWindowResize, false);

            animate();
        }

        function createMemoryStars() {
            memorias.forEach(mem => {
                // Núcleo brilhante
                const coreGeo = new THREE.SphereGeometry(4, 32, 32);
                const coreMat = new THREE.MeshBasicMaterial({ color: mem.color });
                const star = new THREE.Mesh(coreGeo, coreMat);
                
                // Halo 1
                const haloGeo = new THREE.SphereGeometry(7, 32, 32);
                const haloMat = new THREE.MeshBasicMaterial({ color: mem.color, transparent: true, opacity: 0.5, blending: THREE.AdditiveBlending });
                const halo = new THREE.Mesh(haloGeo, haloMat);
                star.add(halo);

                // Halo 2 Maior e Suave
                const haloBigGeo = new THREE.SphereGeometry(15, 32, 32);
                const haloBigMat = new THREE.MeshBasicMaterial({ color: mem.color, transparent: true, opacity: 0.2, blending: THREE.AdditiveBlending });
                const haloBig = new THREE.Mesh(haloBigGeo, haloBigMat);
                star.add(haloBig);

                star.position.set(mem.pos.x, mem.pos.y, mem.pos.z);
                star.userData = { isMemory: true, data: mem, halo: halo, haloBig: haloBig };
                memoryStarsGroup.add(star);
            });
            scene.add(memoryStarsGroup);
        }

        // Poeira mágica apenas na parte superior (onde estão as memórias)
        let dustParticles;
        function createMagicDust() {
            const geo = new THREE.BufferGeometry();
            const mat = new THREE.PointsMaterial({ color: 0xFFD700, size: 2, transparent: true, opacity: 0.6, blending: THREE.AdditiveBlending });
            const verts = [];
            for(let i = 0; i < 600; i++) {
                // Foca a poeira acima do horizonte (y positivo)
                verts.push((Math.random() - 0.5) * 400, Math.random() * 250, (Math.random() - 0.5) * 400);
            }
            geo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
            dustParticles = new THREE.Points(geo, mat);
            scene.add(dustParticles);
        }

        async function startExperience() {
            // Toca a música
            document.getElementById('bg-music').play().catch(e => console.log(e));

            // 1. SOLICITA CÂMERA (AR)
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'environment' } // Pede a câmera traseira
                });
                document.getElementById('ar-camera-feed').srcObject = stream;
            } catch (err) {
                console.error("Câmera não permitida ou inexistente:", err);
                // Se falhar, o fundo fica preto naturalmente e a surpresa continua funcionando.
            }

            // 2. SOLICITA GIROSCÓPIO (Para iOS 13+)
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(permissionState => {
                        if (permissionState === 'granted') {
                            window.addEventListener('deviceorientation', handleOrientation);
                            isGyroEnabled = true;
                        }
                    })
                    .catch(console.error);
            } else {
                window.addEventListener('deviceorientation', handleOrientation);
                isGyroEnabled = true;
            }

            // Ativa UI
            document.getElementById('start-screen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('start-screen').style.visibility = 'hidden';
                document.getElementById('hud').classList.add('visible');
                document.getElementById('crosshair').style.display = 'flex';
                document.getElementById('click-layer').style.display = 'block';
                initScene();
            }, 1000);
        }

        function handleOrientation(event) {
            if (!event.alpha || !event.beta || !event.gamma) return;

            const alpha = THREE.MathUtils.degToRad(event.alpha); // Eixo Z (Bússola)
            const beta = THREE.MathUtils.degToRad(event.beta);   // Eixo X (Inclinação frente/trás)
            const gamma = THREE.MathUtils.degToRad(event.gamma); // Eixo Y (Inclinação lados)

            // Ajuste crucial de Euler para AR funcionar perfeitamente com a câmera traseira
            const euler = new THREE.Euler(beta, alpha, -gamma, 'YXZ');
            camera.quaternion.setFromEuler(euler);
        }

        function onInteract(event) {
            // Sempre mira para o centro da tela (onde está o crosshair)
            mouse.x = 0; 
            mouse.y = 0; 

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(memoryStarsGroup.children);

            if (intersects.length > 0) {
                const star = intersects[0].object;
                if (star.userData.isMemory) {
                    openMemory(star.userData.data);
                }
            }
        }

        function openMemory(data) {
            document.getElementById('mem-month').innerText = data.month;
            document.getElementById('mem-title').innerText = data.title;
            document.getElementById('mem-text').innerText = data.text;
            document.getElementById('memory-overlay').classList.add('active');
            document.getElementById('click-layer').style.display = 'none';
        }

        function closeMemory() {
            document.getElementById('memory-overlay').classList.remove('active');
            document.getElementById('click-layer').style.display = 'block';
        }

        function onWindowResize() {
            if(!camera) return;
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            // Anima as estrelas
            const time = Date.now() * 0.003;
            memoryStarsGroup.children.forEach(star => {
                if (star.userData.halo) {
                    const scale1 = 1 + Math.sin(time + star.position.x) * 0.3;
                    const scale2 = 1 + Math.cos(time + star.position.y) * 0.2;
                    star.userData.halo.scale.set(scale1, scale1, scale1);
                    star.userData.haloBig.scale.set(scale2, scale2, scale2);
                }
            });

            // Gira a poeira dourada lentamente
            if (dustParticles) {
                dustParticles.rotation.y += 0.001;
            }

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
