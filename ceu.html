<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nosso Universo - 3 Meses 🌌</title>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;800&family=Dancing+Script:wght@700&family=Inter:wght@300;400;600&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { overflow: hidden; height: 100vh; width: 100vw; background-color: #000; color: #fff; font-family: 'Inter', sans-serif; }
        
        /* Câmera de fundo */
        #ar-camera-feed { position: absolute; inset: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: 0; opacity: 0; transition: opacity 1s; }

        /* --- TELA DE INÍCIO --- */
        #start-screen {
            position: fixed; inset: 0; z-index: 50000;
            background: linear-gradient(to bottom, #050505, #1a0a00);
            display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;
            padding: 30px; transition: opacity 1.5s ease, visibility 1.5s;
        }
        .start-title { font-family: 'Dancing Script', cursive; font-size: 50px; color: #FF6A00; margin-bottom: 15px; text-shadow: 0 0 20px rgba(255,106,0,0.4); }
        .start-text { font-size: 15px; color: #ccc; line-height: 1.6; max-width: 320px; margin-bottom: 40px; font-weight: 300; }
        .start-btn {
            background: linear-gradient(135deg, #FF6A00, #FF9900); color: #fff; border: none; padding: 18px 40px; border-radius: 50px;
            font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 14px; text-transform: uppercase; letter-spacing: 2px;
            cursor: pointer; box-shadow: 0 10px 30px rgba(255,106,0,0.5); animation: pulseBtn 2s infinite;
        }
        @keyframes pulseBtn { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }

        /* --- HUD --- */
        .ui-hud {
            position: fixed; top: 50px; width: 100%; text-align: center; z-index: 10;
            pointer-events: none; opacity: 0; transition: opacity 1s;
        }
        .ui-hud.visible { opacity: 1; }
        .hud-title { font-family: 'Dancing Script', cursive; font-size: 38px; color: #fff; text-shadow: 0 2px 10px rgba(0,0,0,0.8); margin-bottom: 5px; }
        #hud-instruction { font-family: 'Montserrat', sans-serif; font-size: 11px; text-transform: uppercase; letter-spacing: 3px; color: #FF9900; text-shadow: 0 1px 5px rgba(0,0,0,0.8); transition: color 0.5s; }

        /* --- BOTÃO DE EMERGÊNCIA (Failsafe) --- */
        #force-sky-btn {
            position: fixed; bottom: 50px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.6); border: 1px solid #FFD700; color: #FFD700;
            padding: 12px 25px; border-radius: 50px; font-family: 'Montserrat', sans-serif; font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 2px;
            cursor: pointer; z-index: 20; display: none; backdrop-filter: blur(5px);
            box-shadow: 0 0 15px rgba(255,215,0,0.3);
        }

        /* --- CONSTELAÇÃO CENTRALIZADA --- */
        #constellation-container {
            position: absolute; inset: 0; z-index: 5;
            opacity: 0; visibility: hidden; transition: opacity 1s, visibility 1s;
            pointer-events: none;
        }
        #constellation-container.active { opacity: 1; visibility: visible; pointer-events: auto; }

        .constellation-lines { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        .line { stroke: rgba(255, 153, 0, 0.6); stroke-width: 2.5; stroke-dasharray: 5 5; }

        .star {
            position: absolute; width: 60px; height: 60px; background: transparent;
            border-radius: 50%; transform: translate(-50%, -50%); cursor: pointer;
            animation: starFloat 4s infinite ease-in-out alternate;
            display: flex; justify-content: center; align-items: center;
        }
        .star::after {
            content: ''; position: absolute; width: 12px; height: 12px; background: #fff; border-radius: 50%;
            box-shadow: 0 0 15px 5px currentColor, 0 0 30px 10px currentColor; transition: transform 0.3s;
        }
        
        /* Estrela clicada fica levemente apagada para ela saber onde já foi */
        .star.opened::after { opacity: 0.3; transform: scale(0.8); }

        /* Posições Centralizadas (Formando um V no meio da tela) */
        #star1 { top: 40%; left: 30%; color: #FFD700; animation-delay: 0s; }
        #star2 { top: 60%; left: 50%; color: #FF6A00; animation-delay: -1s; }
        #star3 { top: 40%; left: 70%; color: #00e5ff; animation-delay: -2s; }

        @keyframes starFloat {
            0% { transform: translate(-50%, -50%) scale(0.9); }
            100% { transform: translate(-50%, -55%) scale(1.1); }
        }

        /* --- PAINEL DA MEMÓRIA --- */
        #memory-overlay {
            position: fixed; inset: 0; z-index: 10000;
            background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            display: flex; justify-content: center; align-items: center;
            opacity: 0; visibility: hidden; transition: all 0.4s ease;
        }
        #memory-overlay.active { opacity: 1; visibility: visible; }

        .memory-card {
            background: linear-gradient(to bottom, rgba(255,255,255,0.05), rgba(0,0,0,0.95));
            border: 1px solid rgba(255, 106, 0, 0.4); border-radius: 20px;
            width: 85%; max-width: 380px; padding: 30px 25px; text-align: center;
            transform: translateY(30px) scale(0.95); transition: all 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
            box-shadow: 0 30px 60px rgba(0,0,0,0.9);
            display: flex; flex-direction: column; align-items: center;
        }
        #memory-overlay.active .memory-card { transform: translateY(0) scale(1); }

        .mem-month { font-family: 'Montserrat', sans-serif; font-size: 11px; color: #FF9900; text-transform: uppercase; letter-spacing: 3px; font-weight: 800; margin-bottom: 8px;}
        .mem-title { font-family: 'Dancing Script', cursive; font-size: 34px; color: #fff; text-shadow: 0 2px 5px rgba(0,0,0,0.5); margin-bottom: 20px;}
        .mem-photo { width: 100%; max-height: 220px; object-fit: cover; border-radius: 12px; border: 1px solid rgba(255,106,0,0.3); margin-bottom: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.6); }
        .mem-text { font-size: 15px; line-height: 1.6; color: #e0e0e0; font-weight: 300; font-style: italic; margin-bottom: 30px;}

        .close-btn {
            background: rgba(255,106,0,0.1); border: 1px solid #FF6A00; color: #fff;
            padding: 12px 30px; border-radius: 50px; font-family: 'Montserrat', sans-serif; font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 1px;
            cursor: pointer; transition: all 0.3s;
        }

        /* --- GRAN FINALE (CARTA SECRETA) --- */
        #finale-overlay {
            position: fixed; inset: 0; z-index: 20000;
            background: rgba(0, 0, 0, 0.90); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            opacity: 0; visibility: hidden; transition: opacity 2s ease; padding: 30px; text-align: center;
        }
        #finale-overlay.active { opacity: 1; visibility: visible; }
        
        .finale-text {
            font-family: 'Montserrat', sans-serif; font-size: 18px; line-height: 1.8; color: #FFD700; 
            font-weight: 400; text-shadow: 0 0 15px rgba(255,215,0,0.3); min-height: 200px; max-width: 400px;
        }
        .finale-text::after { content: '|'; animation: blink 0.8s infinite; color: #FFD700; font-weight: 300;}
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

    </style>
</head>
<body>

    <audio id="bg-music" loop preload="auto">
        <source src="musica-3meses.mp3" type="audio/mpeg">
    </audio>

    <video id="ar-camera-feed" autoplay playsinline muted></video>

    <div id="start-screen">
        <h1 class="start-title">Nosso Céu</h1>
        <p class="start-text">Para esta surpresa funcionar, precisamos acessar a câmera e os sensores do seu celular.</p>
        <button class="start-btn" onclick="startExperience()">Permitir</button>
    </div>

    <div class="ui-hud" id="hud">
        <h2 class="hud-title">Nossa História</h2>
        <div id="hud-instruction">Iniciando Universo...</div>
    </div>
    
    <button id="force-sky-btn" onclick="forceSkyActivation()">Revelar Estrelas</button>

    <div id="constellation-container">
        <svg class="constellation-lines" width="100%" height="100%">
            <line class="line" x1="30%" y1="40%" x2="50%" y2="60%" />
            <line class="line" x1="50%" y1="60%" x2="70%" y2="40%" />
        </svg>

        <div class="star" id="star1" onclick="openMemory(1)"></div>
        <div class="star" id="star2" onclick="openMemory(2)"></div>
        <div class="star" id="star3" onclick="openMemory(3)"></div>
    </div>

    <div id="memory-overlay">
        <div class="memory-card">
            <div class="mem-month" id="mem-month">Mês</div>
            <h2 class="mem-title" id="mem-title">Título</h2>
            <img src="" alt="Nossa Memória" id="mem-photo" class="mem-photo">
            <p class="mem-text" id="mem-text">Texto...</p>
            <button class="close-btn" onclick="closeMemory()">Voltar</button>
        </div>
    </div>

    <div id="finale-overlay">
        <p class="finale-text" id="typed-finale"></p>
    </div>

    <script>
        const memorias = {
            1: { month: "Mês 1", title: "O Início", text: "Onde tudo começou. O primeiro mês nos provou que o que sentimos vai além de qualquer distância.", imageUrl: "foto1_3meses.jpg" },
            2: { month: "Mês 2", title: "A Nossa Luz", text: "Encontramos nosso ritmo e construímos o nosso porto seguro. Você iluminou meus dias.", imageUrl: "foto2_3meses.jpg" },
            3: { month: "Mês 3", title: "Nosso Futuro", text: "Obrigado por esses 3 meses incríveis. Mas a surpresa não acaba aqui...", imageUrl: "foto3_3meses.jpg" }
        };

        const finalMessageText = "Thayna,<br><br>Se eu pudesse escolher um lugar seguro, seria ao seu lado.<br><br>Nosso amor encontrou espaço no universo, e a cada dia que passa, eu te amo mais.<br><br>Feliz 3 Meses!<br>— Lucas";

        const instruction = document.getElementById('hud-instruction');
        const constellation = document.getElementById('constellation-container');
        const videoFeed = document.getElementById('ar-camera-feed');
        const forceBtn = document.getElementById('force-sky-btn');
        
        let isSkyActive = false;
        let isManualMode = false;
        let sensorDetected = false; 
        
        // RASTREADOR DE ESTRELAS CLICADAS
        let openedStars = new Set();
        let isFinaleTriggered = false;

        async function startExperience() {
            document.getElementById('bg-music').play().catch(e => console.log("Música aguardando interação:", e));

            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                try {
                    const permissionState = await DeviceOrientationEvent.requestPermission();
                    if (permissionState === 'granted') {
                        window.addEventListener('deviceorientation', handleGyroscope);
                    }
                } catch (error) { console.error("Erro sensor:", error); }
            } else {
                window.addEventListener('deviceorientation', handleGyroscope);
            }

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                videoFeed.srcObject = stream;
                videoFeed.onloadedmetadata = () => { videoFeed.style.opacity = '1'; };
            } catch (err) { console.error("Câmera negada:", err); }

            document.getElementById('start-screen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('start-screen').style.visibility = 'hidden';
                document.getElementById('hud').classList.add('visible');
                instruction.innerText = "Aponte o celular para o céu";
            }, 1000);

            setTimeout(() => {
                if (!sensorDetected) forceBtn.style.display = 'block';
            }, 4000);
        }

        function handleGyroscope(event) {
            if (isManualMode || event.beta === null || isFinaleTriggered) return;
            sensorDetected = true; 
            forceBtn.style.display = 'none';

            if (event.beta > 105 && event.beta <= 180) {
                if (!isSkyActive) activateSky(true, "Toque nas estrelas do nosso céu");
            } else {
                if (isSkyActive) activateSky(false, "Aponte o celular para o céu");
            }
        }

        function forceSkyActivation() {
            isManualMode = true; 
            forceBtn.style.display = 'none'; 
            activateSky(true, "Toque nas estrelas do nosso céu");
        }

        function activateSky(active, textMsg) {
            isSkyActive = active;
            instruction.innerText = textMsg;
            if (active) {
                instruction.style.color = "#FFD700"; 
                constellation.classList.add('active');
            } else {
                instruction.style.color = "#FF9900"; 
                constellation.classList.remove('active');
            }
        }

        function openMemory(id) {
            const data = memorias[id];
            
            // Marca visualmente a estrela como aberta
            document.getElementById(`star${id}`).classList.add('opened');
            openedStars.add(id);

            document.getElementById('mem-month').innerText = data.month;
            document.getElementById('mem-title').innerText = data.title;
            document.getElementById('mem-text').innerText = data.text;
            document.getElementById('mem-photo').src = data.imageUrl; 
            
            document.getElementById('memory-overlay').classList.add('active');
            window.removeEventListener('deviceorientation', handleGyroscope);
        }

        function closeMemory() {
            document.getElementById('memory-overlay').classList.remove('active');
            setTimeout(() => { document.getElementById('mem-photo').src = ""; }, 400);
            
            // CHECAGEM DO GRAN FINALE
            if (openedStars.size === 3 && !isFinaleTriggered) {
                isFinaleTriggered = true; // Trava para não repetir
                setTimeout(triggerFinale, 1000); // Espera 1 segundo após fechar a última foto
            } else if (!isManualMode && !isFinaleTriggered) {
                window.addEventListener('deviceorientation', handleGyroscope);
            }
        }

        // FUNÇÕES DO GRAN FINALE
        function triggerFinale() {
            // Some com a HUD e Constelação
            document.getElementById('hud').classList.remove('visible');
            constellation.classList.remove('active');
            
            // Chama a tela escura
            document.getElementById('finale-overlay').classList.add('active');
            
            // Começa a digitar
            setTimeout(() => { typeWriter(finalMessageText, 0); }, 1500);
        }

        function typeWriter(text, i) {
            if (i < text.length) {
                let char = text.substring(i, i+1);
                let isTag = false;
                
                // Trata as quebras de linha <br>
                if(text.substring(i, i+4) === '<br>') {
                    document.getElementById("typed-finale").innerHTML += '<br>';
                    i += 3;
                    isTag = true;
                } else {
                    document.getElementById("typed-finale").innerHTML += char;
                }
                
                let speed = isTag ? 0 : Math.random() * 40 + 30; // Velocidade de digitação
                setTimeout(function() { typeWriter(text, i + 1); }, speed);
            }
        }
    </script>
</body>
</html>
